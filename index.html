<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧材積系統與生產日報表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        body { background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        
        thead.sticky-header { position: sticky; top: 0; z-index: 10; }
        
        .report-input { width: 100%; height: 100%; min-height: 44px; text-align: center; font-size: 16px; font-weight: 700; background-color: transparent; outline: none; padding: 4px; border-radius: 0; }
        .report-input:focus { background-color: #dcfce7; box-shadow: inset 0 0 0 2px #16a34a; }
        
        .calc-input { width: 100%; height: 100%; min-height: 44px; text-align: center; font-size: 16px; font-weight: 700; background-color: transparent; outline: none; padding: 4px 2px; border-radius: 0; }
        .calc-input:focus { background-color: #e0e7ff; box-shadow: inset 0 0 0 2px #4f46e5; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 偵測螢幕高度(鍵盤彈出時)，隱藏佔空間的底部元素 */
        @media screen and (max-height: 550px) {
            .hide-on-keyboard { display: none !important; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden bg-slate-50">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // ==========================================
        // 1. 圖示元件 (Icons)
        // ==========================================
        const TrashIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"></path></svg>;
        const CalculatorIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="14.01"></line><line x1="16" y1="10" x2="16" y2="10.01"></line><line x1="12" y1="10" x2="12" y2="10.01"></line><line x1="8" y1="10" x2="8" y2="10.01"></line><line x1="12" y1="14" x2="12" y2="14.01"></line><line x1="8" y1="14" x2="8" y2="14.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line><line x1="8" y1="18" x2="8" y2="18.01"></line></svg>;
        const TableIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="9" x2="9" y2="21"></line><line x1="15" y1="9" x2="15" y2="21"></line></svg>;
        const LinkIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
        const MessageIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;
        const BoxIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>;
        const TruckIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"></path><path d="M14 9h4l4 4v5h-3"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>;
        const EditIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const SaveIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;

        // ==========================================
        // 2. 系統常數設定
        // ==========================================
        const ROW_COUNT = 50;

        const USER_FIREBASE_CONFIG = {
            apiKey: "AIzaSyCa0s6Xuxa9Pm3VD7I_WJG_zPjfloZv8D8",
            authDomain: "zy-cbm.firebaseapp.com",
            projectId: "zy-cbm",
            storageBucket: "zy-cbm.firebasestorage.app",
            messagingSenderId: "768904093823",
            appId: "1:768904093823:web:a80401260bf9cb9a1f5f4a"
        };

        const CUSTOMERS = {
            '0': '德冠',
            '1': '松敬',
            '2': '龍興',
            '5': '榮杕',
            '6': '榮隆',
            '7': '森隆',
            '8': '沅興'
        };

        const holidays2026 = [
            '2026-01-01', '2026-01-02', '2026-01-03', '2026-01-04',
            '2026-02-14', '2026-02-15', '2026-02-16', '2026-02-17', '2026-02-18', '2026-02-19', '2026-02-20', '2026-02-21', '2026-02-22',
            '2026-02-27', '2026-02-28', '2026-03-01',
            '2026-04-03', '2026-04-04', '2026-04-05', '2026-04-06',
            '2026-05-01', '2026-05-02', '2026-05-03',
            '2026-06-19', '2026-06-20', '2026-06-21',
            '2026-09-25', '2026-09-26', '2026-09-27', '2026-09-28',
            '2026-10-09', '2026-10-10', '2026-10-11',
            '2026-10-24', '2026-10-25', '2026-10-26',
            '2026-12-25', '2026-12-26', '2026-12-27'
        ];

        // 浮點數精度修復工具
        const fmtNum = (n) => Number(Number(n).toFixed(4));

        // ==========================================
        // 3. 主應用程式元件
        // ==========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('calculator'); // 預設改為明細表格
            const savedYear = localStorage.getItem('zy_year') ? parseInt(localStorage.getItem('zy_year')) : 2026;
            const savedMonth = localStorage.getItem('zy_month') ? parseInt(localStorage.getItem('zy_month')) : (new Date().getMonth() + 1);
            
            const [year, setYear] = useState(savedYear); 
            const [month, setMonth] = useState(savedMonth);

            // 自動計算可選年份 (最少包含 2026 到今年)
            const availableYears = useMemo(() => {
                const currentSystemYear = new Date().getFullYear();
                const yearsArray = Array.from({ length: Math.max(1, currentSystemYear - 2026 + 1) }, (_, i) => 2026 + i);
                if (!yearsArray.includes(savedYear)) yearsArray.push(savedYear);
                return yearsArray.sort((a, b) => a - b);
            }, [savedYear]);
            
            const [reportRows, setReportRows] = useState(Array.from({ length: 31 }, (_, i) => ({ date: i + 1, g1: '', g2: '', g3: '' })));
            const [detailsData, setDetailsData] = useState({});
            
            const [calcContext, setCalcContext] = useState({ date: new Date().getDate(), group: 'calc_only', customer: '1' });
            
            // 擴充 loadedContext 以支援跨月移動追蹤
            const [loadedContext, setLoadedContext] = useState({ year: savedYear, month: savedMonth, date: new Date().getDate(), group: 'calc_only', customer: '1' });
            const [calcRows, setCalcRows] = useState(Array.from({ length: ROW_COUNT }, () => ({ l: '', w: '', t: '', p: '', q: '1', u: '', c: '' })));
            
            // 五大標題欄位是否顯示
            const [isHeaderOpen, setIsHeaderOpen] = useState(true);
            const [isSummaryOpen, setIsSummaryOpen] = useState(true);

            const [user, setUser] = useState(null);
            const [firebaseReady, setFirebaseReady] = useState(false);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [syncStatus, setSyncStatus] = useState('💾 手動儲存');
            
            const [hasInitializedDate, setHasInitializedDate] = useState(false);

            const [focusedReportRow, setFocusedReportRow] = useState(null);
            const [focusedCalcRow, setFocusedCalcRow] = useState(null);
            const [confirmClearCalc, setConfirmClearCalc] = useState(false);
            const [confirmDeleteRowIdx, setConfirmDeleteRowIdx] = useState(null);
            const [viewDetailModal, setViewDetailModal] = useState({ isOpen: false, date: null, group: null });
            
            const [overwriteModal, setOverwriteModal] = useState({ isOpen: false, newTotal: 0, existingTotal: '', targetDate: 1, targetGroup: 'g1' });
            const [warningModal, setWarningModal] = useState({ isOpen: false, message: '', confirmAction: null });
            
            // 防呆跳窗統一整合：儲存 pendingAction 回呼函數，讓跳窗確認後可以直接執行所需修改
            const [moveModal, setMoveModal] = useState({ isOpen: false, fromYear: null, fromMonth: null, fromDate: null, fromGroup: null, fromCustomer: null, toYear: null, toMonth: null, toDate: null, toGroup: null, toCustomer: null, pendingAction: null });

            // 庫存管理專屬狀態
            const [invCustomer, setInvCustomer] = useState('all'); 
            const [invSort, setInvSort] = useState('date');
            const [expandedDates, setExpandedDates] = useState({}); 
            
            // 出貨日報表專屬狀態
            const [shippingReportDate, setShippingReportDate] = useState(new Date().getDate());

            const [isKeyboardOpen, setIsKeyboardOpen] = useState(false);

            // ==========================================
            // 🌟 加入 GAS Webhook 與背景發送機制
            // ==========================================
            const GAS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyF_em3qc5rMwC3xpYLwR4Ev-naWhyFNiouw2VfkhPjGYfz8IPH87SLXzj00bI8EJhq/exec";
            const prevRowsRef = useRef(null);
            const isInitialLoadRef = useRef(true);

            const sendLineNotification = async (changedRow, allProcessedRows) => {
                if (!GAS_WEBHOOK_URL) return;

                const dateObj = new Date(year, month - 1, changedRow.date);
                const dayOfWeek = dateObj.getDay();
                const weekStr = ['日','一','二','三','四','五','六'][dayOfWeek];
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(changedRow.date).padStart(2, '0')}`;

                // 找本週起點與終點 (星期一 ~ 星期日)
                let currentWeekStart = changedRow.date;
                while (currentWeekStart > 1 && new Date(year, month - 1, currentWeekStart).getDay() !== 1) {
                    currentWeekStart--;
                }
                let currentWeekEnd = changedRow.date;
                while (currentWeekEnd < allProcessedRows.length && new Date(year, month - 1, currentWeekEnd).getDay() !== 0) {
                    currentWeekEnd++;
                }

                // 找上週起點與終點
                let prevWeekStart = -1, prevWeekEnd = -1;
                if (currentWeekStart > 1) {
                    prevWeekEnd = currentWeekStart - 1;
                    prevWeekStart = prevWeekEnd;
                    while (prevWeekStart > 1 && new Date(year, month - 1, prevWeekStart).getDay() !== 1) {
                        prevWeekStart--;
                    }
                }

                let weekTotal = 0, prevWeekTotal = 0, monthTotal = 0;
                allProcessedRows.forEach(r => {
                    monthTotal += r.dailyTotal;
                    if (r.date >= currentWeekStart && r.date <= currentWeekEnd) weekTotal += r.dailyTotal;
                    if (prevWeekStart !== -1 && r.date >= prevWeekStart && r.date <= prevWeekEnd) prevWeekTotal += r.dailyTotal;
                });

                const formatNum = (num) => num > 0 ? Number(num.toFixed(2)).toLocaleString() : '-';
                const formatInput = (val) => (val && val !== '') ? val : '-';

                // 🌟 嚴格遵守無圖示純文字格式
                let msg = `生產日報表更新\n`;
                msg += `日期：${dateStr} (${weekStr})\n\n`;
                msg += `第一組：${formatInput(changedRow.g1)}\n`;
                msg += `第二組：${formatInput(changedRow.g2)}\n`;
                msg += `第三組：${formatInput(changedRow.g3)}\n`;
                msg += `本日小計：${formatInput(changedRow.dailyTotal)}\n`;
                msg += `【本週累計】：${formatNum(weekTotal)}\n`;
                msg += `【上週總計】：${formatNum(prevWeekTotal)}\n`;
                msg += `【本月總計】：${formatNum(monthTotal)}`;

                try {
                    await fetch(GAS_WEBHOOK_URL, {
                        method: 'POST',
                        body: JSON.stringify({ message: msg })
                    });
                } catch (e) {
                    console.error("發送通知失敗", e);
                }
            };

            // ==========================================
            // [新增] Enter 自動跳到下一個輸入框功能
            // ==========================================
            const handleEnterToNext = (e, className) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    // 尋找當前畫面上所有符合 className 的 input 元素
                    const inputs = Array.from(document.querySelectorAll(`.${className}`));
                    const index = inputs.indexOf(e.target);
                    // 如果找到且不是最後一個
                    if (index > -1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                        inputs[index + 1].select(); // 自動全選文字，方便覆蓋
                    } else if (index === inputs.length - 1) {
                        e.target.blur(); // 最後一個按 Enter 則取消焦點
                    }
                }
            };

            // 鍵盤與輸入焦點偵測 (自動隱藏下方區塊)
            useEffect(() => {
                const handleFocusIn = (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) setIsKeyboardOpen(true);
                };
                const handleFocusOut = () => {
                    setTimeout(() => {
                        if (!['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) setIsKeyboardOpen(false);
                    }, 50);
                };
                window.addEventListener('focusin', handleFocusIn);
                window.addEventListener('focusout', handleFocusOut);
                return () => {
                    window.removeEventListener('focusin', handleFocusIn);
                    window.removeEventListener('focusout', handleFocusOut);
                };
            }, []);

            // 同步年份與月份的儲存與範圍檢查
            useEffect(() => {
                localStorage.setItem('zy_year', year.toString());
                localStorage.setItem('zy_month', month.toString());
                
                const daysInMonth = new Date(year, month, 0).getDate();
                // 確保切換月份時，日曆的「日」不會超出該月上限 (如 2月沒有 31日)
                setCalcContext(prev => prev.date > daysInMonth ? { ...prev, date: daysInMonth } : prev);
                setShippingReportDate(prev => prev > daysInMonth ? daysInMonth : prev);
            }, [year, month]);

            useEffect(() => {
                const daysInMonth = new Date(year, month, 0).getDate() || 31;
                if (!isLoadingData && reportRows.length !== daysInMonth) {
                    setReportRows(Array.from({ length: daysInMonth }, (_, i) => ({ date: i + 1, g1: '', g2: '', g3: '' })));
                }
            }, [year, month, isLoadingData]);

            // 報表計算邏輯
            const getDayInfo = (dateNum) => {
                const dateObj = new Date(year, month - 1, dateNum);
                const dayOfWeek = dateObj.getDay();
                const weekStr = ['日','一','二','三','四','五','六'][dayOfWeek];
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(dateNum).padStart(2, '0')}`;
                const isHoliday = dayOfWeek === 0 || dayOfWeek === 6 || holidays2026.includes(dateStr);
                return { label: `${dateNum}-${weekStr}`, isHoliday };
            };

            const getNum = (val) => parseFloat(val) || 0;

            const computedReport = useMemo(() => {
                let sumG1 = 0, sumG2 = 0, sumG3 = 0, sumTotal = 0;
                const processedRows = reportRows.map(row => {
                    const dailyTotal = getNum(row.g1) + getNum(row.g2) + getNum(row.g3);
                    const hasData = row.g1 !== '' || row.g2 !== '' || row.g3 !== '';
                    if (hasData) {
                        sumG1 += getNum(row.g1); sumG2 += getNum(row.g2); sumG3 += getNum(row.g3); sumTotal += dailyTotal;
                    }
                    return { ...row, dailyTotal, hasData };
                });
                return { processedRows, sumG1, sumG2, sumG3, sumTotal };
            }, [reportRows]);

            const enrichedReportRows = useMemo(() => {
                const rows = [];
                let currentWeekTotal = 0;

                computedReport.processedRows.forEach((row, idx) => {
                    rows.push({ type: 'day', ...row, originalIndex: idx });
                    currentWeekTotal += row.dailyTotal;

                    const dateObj = new Date(year, month - 1, row.date);
                    if (dateObj.getDay() === 0 || row.date === computedReport.processedRows.length) {
                        rows.push({ type: 'week_total', label: '小計', total: currentWeekTotal, key: `wt-${row.date}` });
                        currentWeekTotal = 0;
                    }
                });

                rows.push({ type: 'month_total', label: '當月總計', g1: computedReport.sumG1, g2: computedReport.sumG2, g3: computedReport.sumG3, total: computedReport.sumTotal, key: 'mt-final' });
                return rows;
            }, [computedReport, year, month]);

            // Firebase 初始化 (加入 onSnapshot)
            useEffect(() => {
                let isMounted = true;
                const initFirebase = async () => {
                    try {
                        const loadModule = (url) => new Function(`return import("${url}")`)();
                        const { initializeApp } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js');
                        const { getAuth, signInWithEmailAndPassword, onAuthStateChanged } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js');
                        // 🌟 加入 onSnapshot
                        const { getFirestore, doc, setDoc, getDoc, onSnapshot } = await loadModule('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                        
                        const app = initializeApp(USER_FIREBASE_CONFIG);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        
                        try {
                            await signInWithEmailAndPassword(auth, 'joe623@zy.com', 'joe0623');
                        } catch (authErr) {
                            if (isMounted) { 
                                setFirebaseReady(true); 
                                setIsLoadingData(false); 
                                setSyncStatus('⚠️ 連線失敗'); 
                            }
                            return;
                        }

                        window.db = db; window.setDoc = setDoc; window.doc = doc; window.onSnapshot = onSnapshot;
                        
                        onAuthStateChanged(auth, (currentUser) => {
                            if (!isMounted) return;
                            setUser(currentUser);
                            setFirebaseReady(true);
                        });
                    } catch (error) {
                        if(isMounted) {
                            setFirebaseReady(true);
                            setIsLoadingData(false);
                            setSyncStatus('⚠️ 連線失敗');
                        }
                    }
                };
                initFirebase();
                return () => { isMounted = false; };
            }, []);

            // 🌟 讀取資料改為 onSnapshot 即時監聽與背景推播
            useEffect(() => {
                if (!user || !firebaseReady || !window.db || !window.onSnapshot) return;

                setIsLoadingData(true);
                isInitialLoadRef.current = true; // 切換月份時重置為 true

                const docId = `report_${year}_${month}`;
                const docPath = window.doc(window.db, 'users', user.uid, 'app_data', docId);

                const unsubscribe = window.onSnapshot(docPath, (snap) => {
                    const days = new Date(year, month, 0).getDate() || 31;
                    let newDataRows = Array.from({ length: days }, (_, i) => ({ date: i + 1, g1: '', g2: '', g3: '' }));
                    let newDetailsData = {};

                    if (snap.exists()) {
                        const data = snap.data();
                        if(data.reportRows) newDataRows = data.reportRows;
                        if(data.detailsData) newDetailsData = data.detailsData;
                    }

                    // 預先計算好每日總和方便比對
                    const getNum = (val) => parseFloat(val) || 0;
                    const processedNewRows = newDataRows.map(row => ({
                        ...row,
                        dailyTotal: getNum(row.g1) + getNum(row.g2) + getNum(row.g3)
                    }));

                    // 如果不是第一次載入，代表有新資料輸入 (可能是另一個後台，或是本地剛存檔完)，進行比對發送
                    if (!isInitialLoadRef.current && prevRowsRef.current) {
                        const changedRow = processedNewRows.find((r, idx) => {
                            const oldR = prevRowsRef.current[idx];
                            return r.g1 !== oldR.g1 || r.g2 !== oldR.g2 || r.g3 !== oldR.g3;
                        });

                        // 若有修改且小計大於 0 才發送通知
                        if (changedRow && changedRow.dailyTotal > 0) {
                            sendLineNotification(changedRow, processedNewRows);
                        }
                    }

                    prevRowsRef.current = processedNewRows;
                    isInitialLoadRef.current = false;

                    setReportRows(newDataRows);
                    setDetailsData(newDetailsData);
                    
                    setIsLoadingData(false);
                    // 為了不干擾手動存檔的使用者介面，只有在載入中才重置為手動儲存
                    setSyncStatus(prev => prev.includes('載入') || prev.includes('連線') ? '💾 手動儲存' : prev);
                }, (error) => {
                    console.error("即時監聽失敗:", error);
                    setIsLoadingData(false);
                    setSyncStatus('⚠️ 讀取失敗');
                });

                return () => unsubscribe(); // 離開時取消監聽
            }, [user, firebaseReady, year, month]);

            // 智慧日期初始化
            useEffect(() => {
                if (!isLoadingData && !hasInitializedDate && reportRows.length > 0) {
                    const today = new Date();
                    const checkY = year;
                    const checkM = month;
                    let targetDate = today.getDate(); 
                    
                    if (checkY !== today.getFullYear() || checkM !== (today.getMonth() + 1)) {
                        targetDate = 1; 
                    }
                    
                    const maxDays = new Date(checkY, checkM, 0).getDate();
                    if (targetDate > maxDays) targetDate = maxDays;
                    if (targetDate < 1) targetDate = 1;

                    setCalcContext(prev => ({ ...prev, date: targetDate, group: 'calc_only', customer: '1' }));
                    setLoadedContext({ year: checkY, month: checkM, date: targetDate, group: 'calc_only', customer: '1' });
                    setShippingReportDate(targetDate);
                    
                    const key = `${targetDate}-calc_only`;
                    setCalcRows(detailsData[key] || Array.from({ length: ROW_COUNT }, () => ({ l: '', w: '', t: '', p: '', q: '1', u: '', c: '' })));
                    
                    setHasInitializedDate(true);
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [isLoadingData, hasInitializedDate]);

            // ==========================================
            // 🚨 全新【核心防呆存檔器】(確保 100% 寫入 Firebase)
            // ==========================================
            const performFirebaseSave = async (payloadReportRows, payloadDetailsData) => {
                if (!user || !window.db) throw new Error("無使用者登入或資料庫尚未連線");
                
                const docId = `report_${year}_${month}`;
                const docPath = window.doc(window.db, 'users', user.uid, 'app_data', docId);

                // 【強制清洗資料】：防止意外的 undefined 導致 Firebase 拒絕寫入崩潰
                const cleanReportRows = payloadReportRows.map(r => ({
                    date: r.date || 1,
                    g1: r.g1 || '',
                    g2: r.g2 || '',
                    g3: r.g3 || '',
                    dailyTotal: Number(r.dailyTotal) || 0
                }));
                const cleanDetailsData = JSON.parse(JSON.stringify(payloadDetailsData));

                // 重新精算總數 (避免誤差)
                let currentWeekTotal = 0;
                const weeklySubtotals = {};
                cleanReportRows.forEach((r, idx) => {
                    currentWeekTotal += r.dailyTotal;
                    const dateObj = new Date(year, month - 1, r.date);
                    if (dateObj.getDay() === 0 || r.date === cleanReportRows.length) {
                        weeklySubtotals[`wt-${r.date}`] = Number(currentWeekTotal.toFixed(2));
                        currentWeekTotal = 0;
                    }
                });

                let sumG1 = 0, sumG2 = 0, sumG3 = 0, sumTotal = 0;
                cleanReportRows.forEach(r => {
                    sumG1 += r.g1 ? Number(r.g1) : 0;
                    sumG2 += r.g2 ? Number(r.g2) : 0;
                    sumG3 += r.g3 ? Number(r.g3) : 0;
                    sumTotal += r.dailyTotal;
                });

                await window.setDoc(docPath, {
                    reportRows: cleanReportRows,
                    detailsData: cleanDetailsData,
                    summary: {
                        totalG1: Number(sumG1.toFixed(2)),
                        totalG2: Number(sumG2.toFixed(2)),
                        totalG3: Number(sumG3.toFixed(2)),
                        totalAll: Number(sumTotal.toFixed(2))
                    },
                    weeklySubtotals: weeklySubtotals,
                    updatedAt: new Date().toISOString()
                }, { merge: true });

                return true;
            };

            // 原：手動儲存按鈕處理器 (加上詳盡的錯誤防呆彈窗)
            const handleManualSave = async () => {
                if (!user || !firebaseReady || !window.setDoc || !window.db) {
                    setWarningModal({
                        isOpen: true,
                        message: `⚠️ 儲存失敗：系統尚未連線成功。\n請確認網路狀態後重新整理網頁！`,
                        confirmAction: () => setWarningModal({ isOpen: false, message: '', confirmAction: null })
                    });
                    return;
                }
                
                setSyncStatus('🔄 儲存中...');
                try {
                    // 自動把當前計算台上的明細也存入 detailsData (防呆：使用者忘記在計算台按儲存就直接點手動儲存)
                    let currentDetailsData = { ...detailsData };
                    if (calcContext.group !== 'calc_only') {
                        const isShipping = calcContext.group === 'shipping';
                        const currentKey = isShipping 
                            ? `${calcContext.date}-shipping-${calcContext.customer}`
                            : `${calcContext.date}-${calcContext.group}`;
                        currentDetailsData[currentKey] = calcRows;
                    }

                    const rowsWithTotals = computedReport.processedRows.map(r => ({
                        ...r,
                        dailyTotal: Number(r.dailyTotal.toFixed(2))
                    }));
                    
                    await performFirebaseSave(rowsWithTotals, currentDetailsData);
                    setDetailsData(currentDetailsData);
                    
                    setSyncStatus('✅ 已儲存');
                    setTimeout(() => setSyncStatus('💾 手動儲存'), 3000);
                } catch (error) {
                    console.error("Save Error:", error);
                    setWarningModal({
                        isOpen: true,
                        message: `❌ 儲存失敗！\n錯誤訊息：${error.message}\n如果一直出現此錯誤，請截圖告知開發者。`,
                        confirmAction: () => setWarningModal({ isOpen: false, message: '', confirmAction: null })
                    });
                    setSyncStatus('⚠️ 儲存失敗');
                }
            };

            // 跨月刪除殘留資料機制 (Firebase非同步操作)
            const removeDataFromOldMonth = async (oldCtx) => {
                if (!user || !window.db) return;
                try {
                    const oldDocId = `report_${oldCtx.year}_${oldCtx.month}`;
                    const oldDocPath = window.doc(window.db, 'users', user.uid, 'app_data', oldDocId);
                    const snap = await new Function('return import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js")')().then(({ getDoc }) => getDoc(oldDocPath));

                    if (snap.exists()) {
                        const data = snap.data();
                        const keyToRemove = oldCtx.group === 'shipping' ? `${oldCtx.date}-shipping-${oldCtx.customer}` : `${oldCtx.date}-${oldCtx.group}`;

                        if (data.detailsData && data.detailsData[keyToRemove]) {
                            // 清空該天該組的資料
                            data.detailsData[keyToRemove] = Array.from({ length: ROW_COUNT }, () => ({ l: '', w: '', t: '', p: '', q: '1', u: '', c: '' }));
                            
                            // 若是生產組別，需要一併清空報表總表對應的欄位
                            if (oldCtx.group !== 'calc_only' && oldCtx.group !== 'shipping') {
                                const rowIndex = data.reportRows.findIndex(r => r.date === oldCtx.date);
                                if (rowIndex > -1) {
                                    data.reportRows[rowIndex][oldCtx.group] = '';
                                    const getNum = (val) => parseFloat(val) || 0;
                                    data.reportRows[rowIndex].dailyTotal = getNum(data.reportRows[rowIndex].g1) + getNum(data.reportRows[rowIndex].g2) + getNum(data.reportRows[rowIndex].g3);
                                }
                            }
                            await window.setDoc(oldDocPath, { detailsData: data.detailsData, reportRows: data.reportRows }, { merge: true });
                        }
                    }
                } catch (e) {
                    console.error("跨月資料清理失敗:", e);
                }
            };

            // -- 數值解析邏輯 --
            const parseL = (val) => {
                if (!val) return 0;
                let str = String(val).trim();
                let n = parseFloat(str);
                if (isNaN(n)) return 0;
                if (n < 1) return n; 
                if (n <= 20) return n / 10;
                if (n > 20 && n <= 200) return n / 100; 
                if (n > 200) return n / 1000; 
                return 0;
            };

            const parseWT = (val) => {
                if (!val) return 0;
                let str = String(val).trim();
                if (str.includes('.')) return parseFloat(str);
                let n = parseFloat(str);
                if (isNaN(n)) return 0;
                if (str.length === 1) return n;
                if (str.length === 2) return n / 10;
                if (str.length === 3) return n / 100;
                if (str.length >= 4) return parseFloat(str[0] + '.' + str.substring(1));
                return 0;
            };

            const computedCalcRows = useMemo(() => {
                return calcRows.map((row, index) => {
                    const parsedL = parseL(row.l);
                    const parsedW = parseWT(row.w);
                    let parsedT = 0;
                    let displayT = String(row.t);
                    if (displayT && ['a', '=', '同', 'δ', '△', 'Δ'].includes(displayT.toLowerCase())) {
                        parsedT = parsedW; 
                    } else {
                        parsedT = parseWT(row.t);
                    }
                    const parsedP = parseInt(row.p) || 0;
                    const parsedQ = parseInt(row.q) || 1;
                    const parsedU = parseFloat(row.u) || 0;
                    
                    const totalBranches = parsedP * parsedQ;
                    const volume = parsedL * parsedW * parsedT * totalBranches;
                    const price = totalBranches * parsedU; 
                    const isValid = volume > 0 || totalBranches > 0;
                    
                    return { ...row, parsedL, parsedW, parsedT, parsedP, parsedQ, parsedU, c: row.c || '', totalBranches, volume, price, isValid, index };
                });
            }, [calcRows]);

            const calcTotalVolume = useMemo(() => {
                return computedCalcRows.reduce((sum, r) => sum + (r.isValid && !isNaN(r.volume) ? r.volume : 0), 0);
            }, [computedCalcRows]);

            const calcTotalQuantity = useMemo(() => {
                return computedCalcRows.reduce((sum, r) => sum + (r.isValid && !isNaN(r.parsedQ) ? r.parsedQ : 0), 0);
            }, [computedCalcRows]);

            // -- 庫存管理核心演算法 (FIFO) --
            const generateInventoryData = (cId, sortBy) => {
                let inventory = [];
                for (let d = 1; d <= 31; d++) {
                    ['g1', 'g2', 'g3'].forEach(g => {
                        const rows = detailsData[`${d}-${g}`] || [];
                        rows.forEach((r, rIdx) => {
                            if (!r.l) return;
                            const rCId = r.c ? String(r.c).trim() : '0';
                            if (cId !== 'all' && rCId !== String(cId)) return; 
                            const q = parseInt(r.q) || 0;
                            if (q <= 0) return;
                            
                            const origL = String(r.l).trim();
                            const origW = String(r.w).trim();
                            const origT = String(r.t).trim();
                            
                            inventory.push({
                                date: d, group: g, rIdx: rIdx, cId: rCId, customerName: CUSTOMERS[rCId] || '未知',
                                origL, origW, origT, dimKey: `${origL}*${origW}*${origT}`,
                                p: parseInt(r.p) || 0, q: q
                            });
                        });
                    });
                }

                let shipping = [];
                for (let d = 1; d <= 31; d++) {
                    const targetCustomers = cId === 'all' ? Object.keys(CUSTOMERS) : [cId];
                    targetCustomers.forEach(shipCId => {
                        const shipKey = `${d}-shipping-${shipCId}`;
                        const rows = detailsData[shipKey] || [];
                        rows.forEach(r => {
                            if (!r.l) return;
                            const q = parseInt(r.q) || 0;
                            if (q <= 0) return;
                            const origL = String(r.l).trim(), origW = String(r.w).trim(), origT = String(r.t).trim();
                            shipping.push({ date: d, cId: shipCId, origL, origW, origT, dimKey: `${origL}*${origW}*${origT}`, p: parseInt(r.p) || 0, q: q });
                        });
                    });
                }

                shipping.forEach(ship => {
                    let qToDeduct = ship.q;
                    for (let i = 0; i < inventory.length; i++) {
                        let prod = inventory[i];
                        if (prod.dimKey === ship.dimKey && prod.p === ship.p && prod.cId === ship.cId && prod.q > 0) {
                            if (prod.q >= qToDeduct) {
                                prod.q -= qToDeduct;
                                qToDeduct = 0;
                                break;
                            } else {
                                qToDeduct -= prod.q;
                                prod.q = 0;
                            }
                        }
                    }
                });

                inventory = inventory.filter(i => i.q > 0);

                if (sortBy === 'date') {
                    const grouped = {};
                    inventory.forEach(item => {
                        if (!grouped[item.date]) grouped[item.date] = [];
                        const existing = grouped[item.date].find(x => x.dimKey === item.dimKey && x.p === item.p && x.cId === item.cId);
                        if (existing) existing.q += item.q;
                        else grouped[item.date].push({ ...item });
                    });
                    return grouped;
                } else {
                    const grouped = {};
                    inventory.forEach(item => {
                        const key = `${item.dimKey}-${item.p}-${item.cId}`;
                        if (!grouped[key]) grouped[key] = { ...item, q: 0 };
                        grouped[key].q += item.q;
                    });
                    return grouped;
                }
            };

            const toggleDateExpand = (dateStr) => {
                setExpandedDates(prev => ({ ...prev, [dateStr]: !prev[dateStr] }));
            };

            // 全域年份與月份修改的防呆攔截器 
            const requestGlobalDateChange = (newY, newM, customAction = null) => {
                const hasData = calcRows.some(r => r.l !== '' || r.w !== '' || r.t !== '' || r.p !== '');
                if (hasData && (year !== newY || month !== newM)) {
                    setMoveModal({
                        isOpen: true,
                        fromYear: year, fromMonth: month, fromDate: calcContext.date, fromGroup: calcContext.group, fromCustomer: calcContext.customer,
                        toYear: newY, toMonth: newM, toDate: calcContext.date, toGroup: calcContext.group, toCustomer: calcContext.customer,
                        pendingAction: () => {
                            if (year !== newY) setYear(newY);
                            if (month !== newM) setMonth(newM);
                            setFocusedCalcRow(null);
                            if (customAction) customAction();
                        }
                    });
                } else {
                    if (year !== newY) setYear(newY);
                    if (month !== newM) setMonth(newM);
                    if (customAction) customAction();
                }
            };

            const handleReportChange = (index, field, value) => {
                if (value !== '' && !/^\d*\.?\d*$/.test(value)) return;
                const newRows = [...reportRows];
                newRows[index] = { ...newRows[index], [field]: value };
                setReportRows(newRows);
            };

            const jumpToCalculator = (date, group, specificCustomer = null) => {
                const targetCustomer = specificCustomer || calcContext.customer;
                setCalcContext({ date, group, customer: targetCustomer });
                setLoadedContext({ year, month, date, group, customer: targetCustomer });
                const key = group === 'shipping' ? `${date}-shipping-${targetCustomer}` : `${date}-${group}`;
                setCalcRows(detailsData[key] || Array.from({ length: ROW_COUNT }, () => ({ l: '', w: '', t: '', p: '', q: '1', u: '', c: '' })));
                setViewDetailModal({ isOpen: false, date: null, group: null });
                setActiveTab('calculator');
                setIsHeaderOpen(true);
            };

            const openDetailModal = (date, group) => {
                const key = `${date}-${group}`;
                if (detailsData[key]) {
                    setViewDetailModal({ isOpen: true, date, group });
                } else {
                    jumpToCalculator(date, group);
                }
            };

            const handleCalcInputChange = (index, field, value) => {
                const newRows = [...calcRows];
                newRows[index] = { ...newRows[index], [field]: value };
                setCalcRows(newRows);
            };

            const handleClearRow = (index) => {
                const newRows = [...calcRows];
                newRows[index] = { l: '', w: '', t: '', p: '', q: '1', u: '', c: '' };
                setCalcRows(newRows);
            };

            const handleCopyAbove = (index) => {
                if (index > 0) {
                    const newRows = [...calcRows];
                    newRows[index].c = newRows[index - 1].c; 
                    newRows[index].l = newRows[index - 1].l;
                    newRows[index].w = newRows[index - 1].w;
                    newRows[index].t = newRows[index - 1].t;
                    setCalcRows(newRows);
                }
            };

            const handleMergeIdentical = () => {
                const newRows = [];
                calcRows.forEach(row => {
                    if (!row.l && !row.w && !row.t && !row.p && (!row.u || row.u === '')) return; 
                    const existing = newRows.find(r => r.l === row.l && r.w === row.w && r.t === row.t && r.p === row.p && r.c === row.c);
                    if (existing) {
                        existing.q = String((parseInt(existing.q) || 1) + (parseInt(row.q) || 1));
                    } else {
                        newRows.push({ ...row, q: row.q || '1' });
                    }
                });
                while (newRows.length < ROW_COUNT) {
                    newRows.push({ l: '', w: '', t: '', p: '', q: '1', u: '', c: '' });
                }
                setCalcRows(newRows);
            };

            const handleFullDateChange = (newYStr, newMStr, newDStr) => {
                const newY = parseInt(newYStr);
                const newM = parseInt(newMStr);
                const maxDays = new Date(newY, newM, 0).getDate();
                let newD = parseInt(newDStr);
                if (newD > maxDays) newD = maxDays;
                
                const newContext = { ...calcContext, date: newD };
                const hasData = calcRows.some(r => r.l !== '' || r.w !== '' || r.t !== '' || r.p !== '');

                if (hasData && (year !== newY || month !== newM || calcContext.date !== newD)) {
                    setMoveModal({
                        isOpen: true,
                        fromYear: year, fromMonth: month, fromDate: calcContext.date, fromGroup: calcContext.group, fromCustomer: calcContext.customer,
                        toYear: newY, toMonth: newM, toDate: newD, toGroup: calcContext.group, toCustomer: calcContext.customer,
                        pendingAction: () => {
                            if (year !== newY) setYear(newY);
                            if (month !== newM) setMonth(newM);
                            setCalcContext(newContext);
                            setFocusedCalcRow(null);
                        }
                    });
                } else {
                    if (year !== newY) setYear(newY);
                    if (month !== newM) setMonth(newM);
                    setCalcContext(newContext);
                    setFocusedCalcRow(null);
                }
            };

            const handleContextChange = (field, value) => {
                const newContext = { ...calcContext, [field]: field === 'date' ? parseInt(value) : value };
                if (field === 'group' && value === 'shipping' && !newContext.customer) {
                    newContext.customer = '1';
                }

                const hasData = calcRows.some(r => r.l !== '' || r.w !== '' || r.t !== '' || r.p !== '');

                if (hasData && (calcContext.group !== newContext.group || (newContext.group === 'shipping' && calcContext.customer !== newContext.customer))) {
                    setMoveModal({
                        isOpen: true,
                        fromYear: year, fromMonth: month, fromDate: calcContext.date, fromGroup: calcContext.group, fromCustomer: calcContext.customer,
                        toYear: year, toMonth: month, toDate: newContext.date, toGroup: newContext.group, toCustomer: newContext.customer,
                        pendingAction: () => {
                            setCalcContext(newContext);
                            setFocusedCalcRow(null);
                        }
                    });
                } else {
                    setCalcContext(newContext);
                    setFocusedCalcRow(null);
                }
            };

            // 🌟 點擊「儲存明細/出貨」時，直接幫用戶背景存上 Firebase！避免遺失
            const handleSaveDetailsOnly = async () => {
                if (calcContext.group === 'calc_only') return;

                const isShipping = calcContext.group === 'shipping';
                const currentKey = isShipping 
                    ? `${calcContext.date}-shipping-${calcContext.customer}`
                    : `${calcContext.date}-${calcContext.group}`;
                    
                const isMoved = loadedContext && (
                    loadedContext.year !== year || loadedContext.month !== month || loadedContext.date !== calcContext.date || 
                    loadedContext.group !== calcContext.group || (isShipping && loadedContext.customer !== calcContext.customer)
                );
                
                if (isMoved && (loadedContext.year !== year || loadedContext.month !== month)) {
                    removeDataFromOldMonth(loadedContext);
                }

                const isSameMonthMove = isMoved && loadedContext.year === year && loadedContext.month === month;
                const oldKey = isSameMonthMove ? (
                    loadedContext.group === 'shipping' 
                        ? `${loadedContext.date}-shipping-${loadedContext.customer}`
                        : `${loadedContext.date}-${loadedContext.group}`
                ) : null;

                const newDetailsData = { ...detailsData, [currentKey]: calcRows };
                if (oldKey) {
                    newDetailsData[oldKey] = Array.from({ length: ROW_COUNT }, () => ({ l: '', w: '', t: '', p: '', q: '1', u: '', c: '' }));
                }

                // 立即更新前端記憶體狀態
                setDetailsData(newDetailsData);
                setLoadedContext({ year, month, ...calcContext });

                if (isShipping) {
                    setActiveTab('shipping_report');
                }

                // 直接背景發射到 Firebase
                setSyncStatus('🔄 儲存中...');
                try {
                    const rowsWithTotals = reportRows.map(r => {
                        const dt = (parseFloat(r.g1)||0) + (parseFloat(r.g2)||0) + (parseFloat(r.g3)||0);
                        return { ...r, dailyTotal: Number(dt.toFixed(2)) };
                    });
                    await performFirebaseSave(rowsWithTotals, newDetailsData);
                    setSyncStatus('✅ 已儲存');
                    setTimeout(() => setSyncStatus('💾 手動儲存'), 3000);
                } catch(err) {
                    console.error("Save Details Error:", err);
                    setSyncStatus('⚠️ 儲存失敗');
                }
            };

            const handleSyncReportClick = () => {
                if (calcContext.group === 'calc_only' || calcContext.group === 'shipping') return;

                const hasMissingCustomer = computedCalcRows.some(r => r.isValid && (!r.c || r.c.trim() === ''));
                if (hasMissingCustomer) {
                    setWarningModal({
                        isOpen: true,
                        message: '有明細資料未輸入客戶代碼！\n這可能會導致無法正確計算該客戶的庫存。\n若未填寫，系統將預設歸類為「0：德冠」。',
                        confirmAction: () => {
                            setWarningModal({ isOpen: false, message: '', confirmAction: null });
                            checkOverwriteAndSync();
                        }
                    });
                    return; 
                }

                checkOverwriteAndSync();
            };

            const checkOverwriteAndSync = () => {
                const total = Math.round(calcTotalVolume);
                const targetRow = reportRows[calcContext.date - 1];
                const existingValue = targetRow ? targetRow[calcContext.group] : '';

                if (existingValue !== '' && parseFloat(existingValue) !== total) {
                    setOverwriteModal({
                        isOpen: true,
                        newTotal: total,
                        existingTotal: existingValue,
                        targetDate: calcContext.date,
                        targetGroup: calcContext.group
                    });
                } else {
                    executeSyncReport(total);
                }
            };

            // 🌟 點擊「同步總表」時，直接背景自動寫入 Firebase
            const executeSyncReport = async (totalOverride) => {
                const total = totalOverride !== undefined ? totalOverride : Math.round(calcTotalVolume);
                const currentKey = `${calcContext.date}-${calcContext.group}`;
                    
                const isMoved = loadedContext && (
                    loadedContext.year !== year || loadedContext.month !== month ||
                    loadedContext.date !== calcContext.date || loadedContext.group !== calcContext.group
                );
                
                if (isMoved && (loadedContext.year !== year || loadedContext.month !== month)) {
                    removeDataFromOldMonth(loadedContext);
                }

                const isSameMonthMove = isMoved && loadedContext.year === year && loadedContext.month === month;
                const oldKey = isSameMonthMove ? `${loadedContext.date}-${loadedContext.group}` : null;

                const newDetailsData = { ...detailsData, [currentKey]: calcRows };
                if (oldKey) {
                    newDetailsData[oldKey] = Array.from({ length: ROW_COUNT }, () => ({ l: '', w: '', t: '', p: '', q: '1', u: '', c: '' }));
                }

                const newReportRows = reportRows.map(r => {
                    let newRow = { ...r };
                    if (newRow.date === calcContext.date) {

                                                        <td className="py-2 px-1 text-center font-mono text-slate-800">{r.l}</td>
                                                        <td className="py-2 px-1 text-center font-mono text-slate-800">{r.w}</td>
                                                        <td className="py-2 px-1 text-center font-mono text-amber-700 font-bold">{r.t}</td>
                                                        <td className="py-2 px-1 text-center font-mono text-blue-700">{r.p}<span className="text-[10px] text-emerald-600 block">×{r.q}件</span></td>
                                                        <td className="py-2 px-1 text-center font-mono text-rose-600 font-bold text-base bg-rose-50/50">
                                                            {r.l ? Number((parseL(r.l)*parseWT(r.w)*(parsedTVal)*(parseInt(r.p)||0)*(parseInt(r.q)||1)).toFixed(2)) : ''}
                                                        </td>
                                                    </tr>
                                                )})}
                                        </tbody>
                                    </table>
                                </div>
                                
                                <div className="p-3 bg-white border-t border-slate-200 flex-shrink-0 flex flex-col gap-2">
                                    <p className="text-[10px] text-center text-slate-500 font-bold">⚠️ 提示：若要扣除庫存請使用 [出貨報表]，此處修改將會變動生產產能。</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setViewDetailModal({ isOpen: false, date: null, group: null })} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold transition-colors">關閉</button>
                                        <button onClick={() => jumpToCalculator(viewDetailModal.date, viewDetailModal.group)} className="flex-[2] py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-colors shadow-sm flex items-center justify-center gap-2"><EditIcon/> 前往修改生產明細</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* 彈出視窗：覆蓋防呆確認視窗 */}
                    {/* ========================================================= */}
                    {overwriteModal.isOpen && (
                        <div className="absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden animate-fade-in">
                                <div className="bg-amber-500 text-white p-4 flex justify-between items-center flex-shrink-0">
                                    <h3 className="font-black text-lg flex items-center gap-2">
                                        ⚠️ 覆蓋確認
                                    </h3>
                                </div>
                                <div className="p-6 text-center">
                                    <p className="text-slate-700 font-bold mb-4">
                                        {month}月 {overwriteModal.targetDate}日 - 第{overwriteModal.targetGroup.replace('g','')}組<br/>日報表已存在資料！
                                    </p>
                                    <div className="flex justify-center items-center gap-4 mb-4">
                                        <div className="bg-slate-100 p-3 rounded-xl min-w-[80px]">
                                            <div className="text-xs text-slate-500 font-bold mb-1">原本材數</div>
                                            <div className="text-2xl font-black text-slate-700">{overwriteModal.existingTotal}</div>
                                        </div>
                                        <div className="text-amber-500 font-black text-xl">➔</div>
                                        <div className="bg-rose-50 p-3 rounded-xl border border-rose-200 min-w-[80px]">
                                            <div className="text-xs text-rose-500 font-bold mb-1">目前材數</div>
                                            <div className="text-2xl font-black text-rose-700">{overwriteModal.newTotal}</div>
                                        </div>
                                    </div>
                                    <p className="text-sm text-red-500 font-bold">請問是否要用「目前材數」強行覆蓋原本日報表的資料？</p>
                                </div>
                                <div className="p-3 bg-slate-50 border-t border-slate-200 flex gap-2">
                                    <button onClick={() => setOverwriteModal({ isOpen: false })} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold transition-colors">取消</button>
                                    <button onClick={() => executeSyncReport(overwriteModal.newTotal)} className="flex-[2] py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold transition-colors shadow-sm">確定覆蓋</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* 彈出視窗：移動資料確認視窗 */}
                    {/* ========================================================= */}
                    {moveModal.isOpen && (
                        <div className="absolute inset-0 z-[60] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden animate-fade-in">
                                <div className="bg-indigo-600 text-white p-4 flex justify-between items-center flex-shrink-0">
                                    <h3 className="font-black text-lg flex items-center gap-2">
                                        🔄 更改儲存目的地
                                    </h3>
                                </div>
                                <div className="p-6 text-center">
                                    <p className="text-slate-700 font-bold mb-4">
                                        是否將目前表格的資料改存到新位置？
                                    </p>
                                    <div className="flex justify-center items-center gap-2 mb-4">
                                        <div className="bg-slate-100 p-3 rounded-xl min-w-[80px] flex-1">
                                            <div className="text-[10px] text-slate-500 font-bold mb-1">原本位置</div>
                                            <div className="text-base font-black text-slate-700">
                                                {moveModal.fromYear}年{moveModal.fromMonth}月{moveModal.fromDate}日<br/>
                                                {moveModal.fromGroup === 'g1' ? '第一組' : moveModal.fromGroup === 'g2' ? '第二組' : moveModal.fromGroup === 'g3' ? '第三組' : moveModal.fromGroup === 'shipping' ? `出貨(${CUSTOMERS[moveModal.fromCustomer] || moveModal.fromCustomer})` : '計算用'}
                                            </div>
                                        </div>
                                        <div className="text-indigo-500 font-black text-xl">➔</div>
                                        <div className="bg-indigo-50 p-3 rounded-xl border border-indigo-200 min-w-[80px] flex-1">
                                            <div className="text-[10px] text-indigo-500 font-bold mb-1">目標位置</div>
                                            <div className="text-base font-black text-indigo-700">
                                                {moveModal.toYear}年{moveModal.toMonth}月{moveModal.toDate}日<br/>
                                                {moveModal.toGroup === 'g1' ? '第一組' : moveModal.toGroup === 'g2' ? '第二組' : moveModal.toGroup === 'g3' ? '第三組' : moveModal.toGroup === 'shipping' ? `出貨(${CUSTOMERS[moveModal.toCustomer] || moveModal.toCustomer})` : '計算用'}
                                            </div>
                                        </div>
                                    </div>
                                    <p className="text-sm text-indigo-600 font-bold">確定要更改目的地嗎？<br/><span className="text-xs text-slate-500 font-normal mt-1 block">(點選確認後，記得按下儲存才會正式生效喔)</span></p>
                                </div>
                                <div className="p-3 bg-slate-50 border-t border-slate-200 flex gap-2">
                                    <button onClick={() => setMoveModal({ ...moveModal, isOpen: false })} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold transition-colors">取消</button>
                                    <button onClick={() => {
                                        if (moveModal.pendingAction) moveModal.pendingAction();
                                        setMoveModal({ ...moveModal, isOpen: false });
                                    }} className="flex-[2] py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition-colors shadow-sm">確定更改</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* 彈出視窗：統一警告防呆視窗 */}
                    {/* ========================================================= */}
                    {warningModal.isOpen && (
                        <div className="absolute inset-0 z-[70] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col overflow-hidden animate-fade-in">
                                <div className="bg-amber-500 text-white p-4 font-black flex items-center gap-2">⚠️ 系統提示</div>
                                <div className="p-6 text-slate-700 font-bold text-center whitespace-pre-line leading-relaxed">
                                    {warningModal.message}
                                </div>
                                <div className="p-3 bg-slate-50 border-t border-slate-200 flex gap-2">
                                    {warningModal.confirmAction ? (
                                        <>
                                            <button onClick={() => setWarningModal({ isOpen: false, message: '', confirmAction: null })} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold transition-colors">取消並檢查</button>
                                            <button onClick={warningModal.confirmAction} className="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold shadow-sm transition-colors">確認執行</button>
                                        </>
                                    ) : (
                                        <button onClick={() => setWarningModal({ isOpen: false, message: '', confirmAction: null })} className="w-full py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-bold transition-colors">我知道了</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ========================================================= */}
                    {/* 底部全局導覽列 (四部分頁，加入鍵盤隱藏邏輯) */}
                    {/* ========================================================= */}
                    <div className={`bg-white border-t border-slate-200 pb-4 sm:pb-0 z-30 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] ${isKeyboardOpen ? 'hidden' : 'flex'}`}>
                        <button onClick={() => setActiveTab('calculator')} className={`flex-1 py-2 sm:py-3 flex flex-col items-center justify-center gap-1 transition-colors ${activeTab === 'calculator' ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                            <CalculatorIcon /> <span className="text-[10px] sm:text-[11px] font-bold">明細表格</span>
                        </button>
                        <div className="w-[1px] bg-slate-200 my-2"></div>
                        <button onClick={() => setActiveTab('inventory')} className={`flex-1 py-2 sm:py-3 flex flex-col items-center justify-center gap-1 transition-colors ${activeTab === 'inventory' ? 'text-amber-600' : 'text-slate-400 hover:text-slate-600'}`}>
                            <BoxIcon /> <span className="text-[10px] sm:text-[11px] font-bold">庫存管理</span>
                        </button>
                        <div className="w-[1px] bg-slate-200 my-2"></div>
                        <button onClick={() => setActiveTab('shipping_report')} className={`flex-1 py-2 sm:py-3 flex flex-col items-center justify-center gap-1 transition-colors ${activeTab === 'shipping_report' ? 'text-sky-600' : 'text-slate-400 hover:text-slate-600'}`}>
                            <TruckIcon /> <span className="text-[10px] sm:text-[11px] font-bold">出貨報表</span>
                        </button>
                        <div className="w-[1px] bg-slate-200 my-2"></div>
                        <button onClick={() => setActiveTab('report')} className={`flex-1 py-2 sm:py-3 flex flex-col items-center justify-center gap-1 transition-colors ${activeTab === 'report' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}>
                            <TableIcon /> <span className="text-[10px] sm:text-[11px] font-bold">生產報表</span>
                        </button>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
