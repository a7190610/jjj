<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>材積計算機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <style>
        body { background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .active-field { border-color: #3b82f6 !important; background-color: #eff6ff !important; box-shadow: 0 0 0 2px #bfdbfe; }
        .numpad-btn { transition: all 0.05s; }
        .numpad-btn:active { transform: scale(0.95); background-color: #cbd5e1; }
        /* 隱藏滾動條但保留滾動功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden text-slate-800">
    <div id="root" class="h-full w-full max-w-md mx-auto bg-white shadow-2xl flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 沿用原系統的特殊解析邏輯
        const parseL = (val) => {
            if (!val) return 0;
            let str = String(val).trim();
            let n = parseFloat(str);
            if (isNaN(n)) return 0;
            if (n < 1) return n; 
            if (n <= 20) return n / 10;
            if (n > 20 && n <= 200) return n / 100; 
            if (n > 200) return n / 1000; 
            return 0;
        };

        const parseWT = (val) => {
            if (!val) return 0;
            let str = String(val).trim();
            if (str.includes('.')) return parseFloat(str);
            let n = parseFloat(str);
            if (isNaN(n)) return 0;
            if (str.length === 1) return n;
            if (str.length === 2) return n / 10;
            if (str.length === 3) return n / 100;
            if (str.length >= 4) return parseFloat(str[0] + '.' + str.substring(1));
            return 0;
        };

        const fmtNum = (n) => Number(Number(n).toFixed(4));

        const App = () => {
            // 輸入狀態
            const [input, setInput] = useState({ l: '', w: '', t: '', p: '', q: '' });
            // 目前正在輸入的欄位
            const [activeField, setActiveField] = useState('l');
            // 明細紀錄
            const [records, setRecords] = useState([]);
            // 複製狀態提示
            const [copyStatus, setCopyStatus] = useState(false);
            
            const listEndRef = useRef(null);

            // 自動滾動到最新一筆明細
            useEffect(() => {
                listEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [records]);

            // 處理數字鍵盤點擊
            const handleNumClick = (val) => {
                setInput(prev => ({
                    ...prev,
                    [activeField]: prev[activeField] + val
                }));
            };

            // 處理刪除鍵
            const handleDelete = () => {
                setInput(prev => ({
                    ...prev,
                    [activeField]: prev[activeField].slice(0, -1)
                }));
            };

            // 切換上下一個欄位
            const moveField = (direction) => {
                const fields = ['l', 'w', 't', 'p', 'q'];
                const currentIndex = fields.indexOf(activeField);
                
                if (direction === 'next' && currentIndex < fields.length - 1) {
                    setActiveField(fields[currentIndex + 1]);
                } else if (direction === 'prev' && currentIndex > 0) {
                    setActiveField(fields[currentIndex - 1]);
                }
            };

            // 計算並加入清單
            const handleAddRecord = () => {
                if (!input.l && !input.w && !input.t && !input.p) return;

                const parsedL = parseL(input.l);
                const parsedW = parseWT(input.w);
                
                let parsedT = 0;
                let displayT = String(input.t);
                if (displayT && ['a', '=', '同', 'δ', '△', 'Δ'].includes(displayT.toLowerCase())) {
                    parsedT = parsedW; 
                } else {
                    parsedT = parseWT(input.t);
                }
                
                const parsedP = parseInt(input.p) || 0;
                // 如果件數是空白，預設為 1 以利計算
                const parsedQ = parseInt(input.q) || 1; 
                
                const totalBranches = parsedP * parsedQ;
                const volume = parsedL * parsedW * parsedT * totalBranches;

                const newRecord = {
                    ...input,
                    parsedL, parsedW, parsedT, parsedP, parsedQ,
                    totalBranches, volume,
                    id: Date.now()
                };

                setRecords([...records, newRecord]);
                
                // 重置輸入區，準備下一筆 (件數同樣維持空白)
                setInput({ l: '', w: '', t: '', p: '', q: '' });
                setActiveField('l');
            };

            // 複製到 Excel 功能 (TSV 格式)
            const handleCopyToExcel = () => {
                if (records.length === 0) return;

                // 產生每筆明細
                const tsvRows = records.map(r => {
                    // 如果厚度輸入 a 或是同等符號，替換成寬度的數字
                    let outT = r.t;
                    if (['a', '=', '同', 'δ', '△', 'Δ'].includes(String(r.t).toLowerCase())) {
                        outT = r.w;
                    }
                    // 長 寬 厚 支數 件數
                    return `${r.l}\t${r.w}\t${outT}\t${r.p}\t${r.parsedQ}`;
                });

                const totalBranches = records.reduce((sum, r) => sum + r.totalBranches, 0);
                const totalPieces = records.reduce((sum, r) => sum + r.parsedQ, 0);

                // 最底部的加總行 (跳過前三欄)
                tsvRows.push(`\t\t\t${totalBranches}\t${totalPieces}`);

                const tsvString = tsvRows.join('\n');

                navigator.clipboard.writeText(tsvString)
                    .then(() => {
                        setCopyStatus(true);
                        setTimeout(() => setCopyStatus(false), 2000);
                    })
                    .catch(err => {
                        console.error('複製失敗:', err);
                        // 針對較舊設備的 fallback
                        const textArea = document.createElement("textarea");
                        textArea.value = tsvString;
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        try {
                            document.execCommand('copy');
                            setCopyStatus(true);
                            setTimeout(() => setCopyStatus(false), 2000);
                        } catch (err) {
                            console.error('Fallback 複製失敗:', err);
                            alert("複製失敗，請手動選取複製");
                        }
                        document.body.removeChild(textArea);
                    });
            };

            // === 加入實體鍵盤監聽 ===
            useEffect(() => {
                const handleKeyDown = (e) => {
                    // 防止觸發瀏覽器其他快捷鍵
                    const key = e.key;

                    // 攔截數字與小數點
                    if (/^[0-9.]$/.test(key)) {
                        e.preventDefault();
                        handleNumClick(key);
                    } 
                    // 攔截倒退鍵
                    else if (key === 'Backspace') {
                        e.preventDefault();
                        handleDelete();
                    } 
                    // 攔截 Enter 鍵
                    else if (key === 'Enter') {
                        e.preventDefault();
                        if (activeField === 'q') {
                            handleAddRecord(); // 在件數欄位按 Enter，直接加入清單
                        } else {
                            moveField('next'); // 其他欄位按 Enter，等於下一步
                        }
                    }
                    // 攔截 Esc 鍵 (返回上一頁)
                    else if (key === 'Escape') {
                        e.preventDefault();
                        window.history.back();
                    }
                    // 攔截 a 鍵 (如果在厚度欄位，自動帶入 a 並跳下一步)
                    else if (key.toLowerCase() === 'a' && activeField === 't') {
                        e.preventDefault();
                        setInput(prev => ({ ...prev, t: 'a' }));
                        setActiveField('p');
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [input, activeField, records]); // 確保能拿到最新的狀態

            // 刪除單筆紀錄
            const removeRecord = (id) => {
                setRecords(records.filter(r => r.id !== id));
            };

            const totalVolume = records.reduce((sum, r) => sum + r.volume, 0);
            const totalPieces = records.reduce((sum, r) => sum + r.parsedQ, 0);

            // 欄位顯示設定
            const fieldsConfig = [
                { id: 'l', label: '長度', color: 'text-slate-800' },
                { id: 'w', label: '寬度', color: 'text-slate-800' },
                { id: 't', label: '厚度', color: 'text-amber-700' },
                { id: 'p', label: '支數', color: 'text-blue-700' },
                { id: 'q', label: '件數', color: 'text-emerald-700' }
            ];

            return (
                <div className="flex flex-col h-full bg-slate-100 relative">
                    
                    {/* 頂部：標題與總計 */}
                    <div className="bg-indigo-600 text-white p-3 flex justify-between items-center shadow-md z-10 shrink-0">
                        <div className="flex items-center gap-2">
                            {/* 手機按返回或點擊此按鈕，都會回到上一頁 */}
                            <button onClick={() => window.history.back()} className="text-white hover:text-indigo-200 active:scale-90 transition-transform p-1 rounded-md" aria-label="返回上一頁">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                            </button>
                            <h1 className="font-black text-lg">材積計算機</h1>
                        </div>
                        <div className="flex gap-3 text-right">
                            <div className="flex flex-col">
                                <span className="text-[10px] text-indigo-200">總件數</span>
                                <span className="font-bold font-mono leading-none">{totalPieces}</span>
                            </div>
                            <div className="flex flex-col">
                                <span className="text-[10px] text-indigo-200">總材積</span>
                                <span className="font-black text-lg font-mono text-rose-300 leading-none">{totalVolume.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>

                    {/* 中間：明細清單 (可滾動) */}
                    <div className="flex-1 overflow-y-auto p-2 no-scrollbar bg-slate-50">
                        {records.length === 0 ? (
                            <div className="h-full flex items-center justify-center text-slate-400 font-bold text-sm">
                                尚未輸入任何資料
                            </div>
                        ) : (
                            <div className="flex flex-col gap-2 pb-2">
                                {records.map((r, idx) => (
                                    <div key={r.id} className="bg-white p-2 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between animate-fade-in">
                                        <div className="flex items-center gap-2">
                                            <div className="bg-slate-100 text-slate-500 font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center shrink-0">
                                                {idx + 1}
                                            </div>
                                            <div className="flex flex-col">
                                                <div className="flex gap-2 font-mono text-sm font-bold text-slate-700">
                                                    <span>{r.l || '-'}</span>
                                                    <span className="text-slate-300">×</span>
                                                    <span>{r.w || '-'}</span>
                                                    <span className="text-slate-300">×</span>
                                                    <span className="text-amber-700">{r.t || '-'}</span>
                                                </div>
                                                <div className="text-[10px] text-slate-400 font-mono mt-0.5">
                                                    公式: {fmtNum(r.parsedL)}×{fmtNum(r.parsedW)}×{fmtNum(r.parsedT)}×{r.parsedP} 
                                                    <span className="text-emerald-600 font-bold ml-1">(×{r.parsedQ}件)</span>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="flex items-center gap-3">
                                            <div className="text-right">
                                                <div className="text-[10px] text-blue-600 font-bold">{r.totalBranches} 支</div>
                                                <div className="font-black text-rose-600 font-mono text-base">{r.volume.toFixed(2)}</div>
                                            </div>
                                            <button 
                                                onClick={() => removeRecord(r.id)}
                                                className="w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 rounded-lg active:bg-red-200"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                    </div>
                                ))}
                                <div ref={listEndRef} />
                            </div>
                        )}
                    </div>

                    {/* 底部：輸入顯示螢幕區 */}
                    <div className="bg-white border-t-2 border-slate-200 p-2 shrink-0">
                        <div className="flex gap-1 justify-between mb-2">
                            {fieldsConfig.map(f => (
                                <div 
                                    key={f.id}
                                    onClick={() => setActiveField(f.id)}
                                    className={`flex-1 border-2 rounded-lg p-1.5 flex flex-col items-center justify-center bg-slate-50 cursor-pointer transition-colors ${activeField === f.id ? 'active-field' : 'border-slate-200'} ${input[f.id] ? 'bg-white' : ''}`}
                                >
                                    <span className="text-[10px] text-slate-400 font-bold mb-0.5">{f.label}</span>
                                    <span className={`font-mono font-black text-lg h-6 flex items-center ${f.color}`}>
                                        {input[f.id] || ''}
                                        {activeField === f.id && <span className="w-1.5 h-5 bg-blue-500 animate-pulse ml-0.5"></span>}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* 底部：自訂虛擬數字鍵盤 */}
                    <div className="bg-slate-200 p-2 shrink-0 pb-6">
                        <div className="grid grid-cols-4 gap-2 h-48">
                            <button onClick={() => handleNumClick('7')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">7</button>
                            <button onClick={() => handleNumClick('8')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">8</button>
                            <button onClick={() => handleNumClick('9')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">9</button>
                            <button onClick={handleDelete} className="numpad-btn bg-slate-300 rounded-xl font-bold text-slate-700 shadow-sm flex items-center justify-center text-xl">⌫</button>

                            <button onClick={() => handleNumClick('4')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">4</button>
                            <button onClick={() => handleNumClick('5')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">5</button>
                            <button onClick={() => handleNumClick('6')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">6</button>
                            <button 
                                onClick={handleCopyToExcel} 
                                className={`numpad-btn rounded-xl font-bold shadow-sm text-sm border ${copyStatus ? 'bg-emerald-100 text-emerald-700 border-emerald-300' : 'bg-sky-100 text-sky-700 border-sky-300'}`}
                            >
                                {copyStatus ? '✅ 複製成功' : '📋 複製明細'}
                            </button>

                            <button onClick={() => handleNumClick('1')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">1</button>
                            <button onClick={() => handleNumClick('2')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">2</button>
                            <button onClick={() => handleNumClick('3')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">3</button>
                            <button onClick={() => {
                                if (activeField === 'q') handleAddRecord();
                                else moveField('next');
                            }} className="numpad-btn bg-indigo-100 rounded-xl font-bold text-indigo-700 shadow-sm row-span-2 text-lg border border-indigo-200">
                                {activeField === 'q' ? '加入' : '下一步'}
                            </button>

                            <button onClick={() => handleNumClick('0')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm col-span-2">0</button>
                            <button onClick={() => handleNumClick('.')} className="numpad-btn bg-white rounded-xl font-mono text-2xl font-bold text-slate-700 shadow-sm">.</button>
                        </div>
                        
                        {/* 獨立的大顆加入按鈕 */}
                        <button 
                            onClick={handleAddRecord}
                            className="w-full mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl py-4 rounded-xl shadow-md transition-transform active:scale-[0.98] flex items-center justify-center gap-2"
                        >
                            ➕ 計算並加入清單
                        </button>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
