<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>兆級倖存者：效能極限版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a202c; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .pointer-events-auto { pointer-events: auto; }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
        .heal-text { 
            position: absolute; color: #33ff33; font-weight: bold; font-size: 1.2rem;
            text-shadow: 1px 1px 2px black, -1px -1px 2px black;
            animation: floatUp 1s ease-out forwards; pointer-events: none; z-index: 10;
        }
        .player-dmg-text { 
            position: absolute; color: #ff0000; font-weight: 900; font-size: 1.8rem;
            text-shadow: 0 0 10px white, 2px 2px 0 black;
            animation: floatUp 0.8s ease-out forwards; pointer-events: none; z-index: 20;
        }
        
        .modal-bg { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); }
        .weapon-slot { transition: all 0.2s; border: 2px solid #4a5568; }
        .weapon-slot.active { border-color: #f6e05e; background-color: rgba(246, 224, 94, 0.2); transform: scale(1.1); box-shadow: 0 0 10px #f6e05e; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #718096; border-radius: 3px; }

        #joystickZone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; z-index: 5; }
        #joystickBase { position: absolute; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; display: none; transform: translate(-50%, -50%); pointer-events: none; }
        #joystickStick { position: absolute; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        .boss-warning { animation: pulseRed 1s infinite; }
        @keyframes pulseRed {
            0%, 100% { color: #f56565; text-shadow: 0 0 5px #f56565; }
            50% { color: #fff; text-shadow: 0 0 15px #f56565; }
        }
    </style>
</head>
<body>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Joystick Zone -->
    <div id="joystickZone">
        <div id="joystickBase">
            <div id="joystickStick"></div>
        </div>
    </div>

    <!-- UI Layer -->
    <div id="uiLayer" class="ui-layer flex flex-col justify-between p-4 z-10">
        <div class="flex justify-between items-start pointer-events-auto">
            <div>
                <div class="bg-gray-800 bg-opacity-75 rounded px-3 py-1 mb-2 border border-gray-600 shadow pointer-events-none">
                    <div class="text-xl font-bold text-blue-400">Lv. <span id="uiLevel">1</span></div>
                    <div class="text-sm text-gray-300">經驗值: <span id="uiXp">0</span> / <span id="uiNextXp">10</span></div>
                    <div class="w-full bg-gray-700 h-2 mt-1 rounded overflow-hidden">
                        <div id="xpBar" class="bg-blue-500 h-full w-0 transition-all duration-200"></div>
                    </div>
                </div>
                <div class="bg-gray-800 bg-opacity-75 rounded px-3 py-1 border border-gray-600 shadow text-sm space-y-1 pointer-events-none">
                    <div class="text-red-400">生命值: <span id="uiHp">50</span> / <span id="uiMaxHp">50</span></div>
                    <div class="text-yellow-400">擊殺數: <span id="uiKills">0</span></div>
                    <div class="text-orange-400">基礎攻擊力: <span id="uiDamage">1</span></div>
                    <div class="text-gray-400 font-mono text-lg">時間: <span id="uiTime">00:00</span></div>
                    <div class="text-purple-400">難度: <span id="uiDiffText">普通 (x5)</span></div>
                </div>
            </div>
            
            <div class="flex flex-col items-end space-y-2 pointer-events-auto">
                <button id="pauseBtn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded border border-gray-500 shadow transition z-20">
                    ⏸ 暫停 / 裝備
                </button>
                <div class="bg-gray-900 bg-opacity-80 rounded-lg p-2 flex space-x-2 border border-gray-700" id="weaponContainer"></div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="absolute inset-0 modal-bg flex flex-col items-center justify-center z-50 pointer-events-auto">
        <h1 class="text-6xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-yellow-500 tracking-wider" style="-webkit-text-stroke: 1px white;">兆級倖存者</h1>
        <p class="text-xl text-gray-300 mb-8">擊殺 1兆隻怪物，挑戰裝置的極限！</p>
        
        <button id="startBtn" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-[0_0_20px_rgba(79,70,229,0.5)] transition transform hover:scale-105">
            開始極限生存
        </button>
    </div>

    <!-- Difficulty Item Screen -->
    <div id="diffScreen" class="absolute inset-0 modal-bg flex-col items-center justify-center z-50 hidden pointer-events-auto">
        <h2 class="text-5xl font-bold text-purple-400 mb-2 animate-bounce">難度調整器</h2>
        <p class="text-gray-300 mb-8 text-xl">擊殺BOSS獲得的權限！請選擇新的世界難度</p>
        
        <div class="bg-gray-800 p-6 rounded-lg border border-gray-600 mb-8 w-80 text-center">
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button class="i-diff-btn bg-green-600 hover:bg-green-500 text-white py-2 rounded" data-val="1">簡單 (x1)</button>
                <button class="i-diff-btn bg-blue-600 hover:bg-blue-500 text-white py-2 rounded border-2 border-white" data-val="5">普通 (x5)</button>
                <button class="i-diff-btn bg-orange-600 hover:bg-orange-500 text-white py-2 rounded" data-val="25">困難 (x25)</button>
                <button class="i-diff-btn bg-red-700 hover:bg-red-600 text-white py-2 rounded font-bold" data-val="100">地獄 (x100)</button>
            </div>
            <div class="mt-4">
                <label class="text-sm text-gray-300">自訂難度倍率：</label>
                <input type="number" id="itemCustomDiff" class="w-full bg-gray-700 text-white rounded p-1 text-center mt-1 border border-gray-500" placeholder="輸入數字">
            </div>
        </div>

        <button id="applyDiffBtn" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 px-12 rounded-full text-2xl shadow transition transform hover:scale-105">
            確認並繼續
        </button>
    </div>

    <!-- Level Up Screen -->
    <div id="levelUpScreen" class="absolute inset-0 modal-bg flex-col items-center justify-center z-40 hidden pointer-events-auto">
        <h2 class="text-5xl font-bold text-yellow-400 mb-2 animate-bounce">等級提升！</h2>
        <p class="text-gray-300 mb-8 text-xl">使用數字鍵 1, 2, 3 快速選擇</p>
        <div id="skillsContainer" class="flex flex-col md:flex-row gap-4 w-full max-w-5xl px-4 justify-center items-stretch"></div>
        <button id="rerollBtn" class="mt-8 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-8 rounded-full border-2 border-gray-500 shadow-lg transition transform hover:scale-105">
            🔄 刷新技能選單
        </button>
    </div>

    <!-- Pause / Weapons Screen -->
    <div id="pauseScreen" class="absolute inset-0 modal-bg flex-col items-center justify-start py-10 z-50 hidden pointer-events-auto overflow-y-auto">
        <h2 class="text-4xl font-bold text-white mb-6 tracking-widest">遊戲暫停</h2>
        
        <div class="flex flex-col md:flex-row gap-6 w-full max-w-6xl px-4">
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-600 flex-1">
                <h3 class="text-lg font-bold mb-4 text-gray-200 text-center">已裝備武器 & 特效</h3>
                <div id="pauseWeaponsList" class="flex flex-col gap-3 max-h-[60vh] overflow-y-auto pr-2"></div>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-600 flex-1">
                <h3 class="text-lg font-bold mb-4 text-gray-200 text-center">已獲得技能</h3>
                <div id="acquiredSkillsList" class="flex flex-col gap-2 max-h-[60vh] overflow-y-auto pr-2"></div>
            </div>
        </div>

        <button id="resumeBtn" class="mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-12 rounded-full text-xl shadow transition">
            繼續遊戲
        </button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="absolute inset-0 modal-bg flex-col items-center justify-center z-50 hidden pointer-events-auto">
        <h2 class="text-6xl font-bold text-red-500 mb-4">你已陣亡</h2>
        <div class="text-2xl text-white mb-2">最終等級: <span id="goLevel" class="text-blue-400 font-bold"></span></div>
        <div class="text-2xl text-white mb-8">總擊殺數: <span id="goKills" class="text-yellow-400 font-bold"></span></div>
        <button id="restartBtn" class="bg-white text-black hover:bg-gray-200 font-bold py-3 px-8 rounded-full text-xl transition">重新極限挑戰</button>
    </div>

    <script>
        // --- Utility ---
        function formatNum(num) {
            if (!isFinite(num)) return "∞"; 
            if (num >= 1e15) return num.toExponential(2); 
            if (num >= 1e12) return (num / 1e12).toFixed(2) + '兆';
            if (num >= 1e8) return (num / 1e8).toFixed(2) + '億';
            if (num >= 1e4) return (num / 1e4).toFixed(2) + '萬';
            return Math.floor(Math.max(0, num)).toString();
        }

        // Fast integer coordinate check
        function inView(x, y, padding) {
            return (x > camera.x - padding && x < camera.x + width/ZOOM + padding &&
                    y > camera.y - padding && y < camera.y + height/ZOOM + padding);
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        const ZOOM = 0.65; 

        window.addEventListener('resize', () => {
            width = window.innerWidth; height = window.innerHeight;
            canvas.width = width; canvas.height = height;
        });

        // --- Game State ---
        let gameState = 'start'; 
        let lastTime = 0;
        let gameTime = 0; 
        let difficulty = 5; 
        let levelUpQueue = 0;
        let gameLoopId = null; 
        let bossActive = false;
        let nextBossTime = 300; 
        let bossPhase2Triggered = false;
        let currentBoss = null;

        const camera = { x: 0, y: 0 };
        const mapSize = { width: 8000, height: 8000 };

        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        const joystick = { active: false, startX: 0, startY: 0, deltaX: 0, deltaY: 0 };
        const joystickZone = document.getElementById('joystickZone');
        const joystickBase = document.getElementById('joystickBase');
        const joystickStick = document.getElementById('joystickStick');
        
        let visualEffects = []; 
        let mouse = { x: width/2, y: height/2 };

        window.addEventListener('keydown', (e) => { 
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true; 
            if (['1','2','3','4','5'].includes(e.key)) {
                if (gameState === 'playing') switchWeaponByIndex(parseInt(e.key) - 1);
                else if (gameState === 'levelup') {
                    let btns = document.querySelectorAll('.skill-choice-btn');
                    let idx = parseInt(e.key) - 1;
                    if (btns[idx]) btns[idx].click();
                }
            }
            if (e.key === 'Escape' && gameState === 'playing') openPauseMenu();
        });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });

        function handleJoystickStart(x, y) {
            if (gameState !== 'playing') return;
            joystick.active = true; joystick.startX = x; joystick.startY = y; joystick.deltaX = 0; joystick.deltaY = 0;
            joystickBase.style.display = 'block'; joystickBase.style.left = `${x}px`; joystickBase.style.top = `${y}px`;
            joystickStick.style.transform = `translate(-50%, -50%)`;
        }
        function handleJoystickMove(x, y) {
            if (!joystick.active) return;
            let dx = x - joystick.startX; let dy = y - joystick.startY;
            let distance = Math.hypot(dx, dy); const maxDistance = 40; 
            if (distance > maxDistance) { dx = (dx / distance) * maxDistance; dy = (dy / distance) * maxDistance; }
            joystick.deltaX = dx / maxDistance; joystick.deltaY = dy / maxDistance;
            joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        }
        function handleJoystickEnd() { joystick.active = false; joystick.deltaX = 0; joystick.deltaY = 0; joystickBase.style.display = 'none'; }

        joystickZone.addEventListener('mousedown', (e) => { if (e.button === 0) handleJoystickStart(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if (joystick.active) handleJoystickMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { handleJoystickEnd(); });
        joystickZone.addEventListener('touchstart', (e) => { if (e.touches.length > 0) handleJoystickStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
        window.addEventListener('touchmove', (e) => { if (joystick.active && e.touches.length > 0) { handleJoystickMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } }, {passive: false});
        window.addEventListener('touchend', () => { handleJoystickEnd(); });
        window.addEventListener('touchcancel', () => { handleJoystickEnd(); });
        window.addEventListener('blur', () => { if (gameState === 'playing') openPauseMenu(); });

        // --- Data ---
        const weaponsDb = [
            { id: 'pistol', name: '手槍', type: 'single', color: '#a0aec0', baseDmg: 1, cooldown: 30, speed: 12, pierce: 1, desc: '單發高頻射擊' },
            { id: 'bow', name: '長弓', type: 'pierce', color: '#d69e2e', baseDmg: 1, cooldown: 50, speed: 18, pierce: 3, desc: '基礎高穿透' },
            { id: 'boomerang', name: '迴力鏢', type: 'return', color: '#38b2ac', baseDmg: 1, cooldown: 70, speed: 10, pierce: 99, desc: '飛出後折返' },
            { id: 'shotgun', name: '散彈槍', type: 'single', color: '#e53e3e', baseDmg: 1, cooldown: 60, speed: 18, pierce: 0, desc: '近距離大範圍強擊退散射' },
            { id: 'wand', name: '魔法杖', type: 'homing', color: '#9f7aea', baseDmg: 1, cooldown: 55, speed: 8, pierce: 0, desc: '發射自動追蹤的魔法球' },
            { id: 'shuriken', name: '飛鏢', type: 'ricochet', color: '#718096', baseDmg: 1, cooldown: 45, speed: 14, pierce: 0, desc: '穿透並在敵人中彈跳' },
            { id: 'missile', name: '追蹤導彈', type: 'explosive', color: '#ed8936', baseDmg: 1, cooldown: 90, speed: 6, pierce: 0, desc: '速度慢但必定追蹤並爆炸' }
        ];

        function getWeaponEffectsDesc(wepId, lv) {
            let desc = "";
            if (wepId === 'pistol') {
                if(lv>=3) desc += "<br>Lv3: 反彈牆壁(+3次)";
                if(lv>=5) desc += "<br>Lv5: 三連發點射";
                if(lv>=10) desc += "<br>Lv10: 爆裂彈(範圍傷害)";
                if(lv>=15) desc += "<br>Lv15: 破片散射";
                if(lv>=20) desc += "<br>Lv20: 五連發格林機槍";
                if(lv>=25) desc += "<br>Lv25: 核爆彈(極大範圍)";
                if(lv>=50) desc += "<br>Lv50: 毀滅彈幕";
            } else if (wepId === 'bow') {
                if(lv>=3) desc += "<br>Lv3: 命中向後分裂";
                if(lv>=5) desc += "<br>Lv5: 無限穿透";
                if(lv>=10) desc += "<br>Lv10: 鎖定追蹤";
                if(lv>=15) desc += "<br>Lv15: 命中降下天雷箭雨";
                if(lv>=20) desc += "<br>Lv20: 幻影分身箭(飛行中增殖)";
                if(lv>=25) desc += "<br>Lv25: 審判雷擊(延遲天雷)";
                if(lv>=50) desc += "<br>Lv50: 萬箭齊發";
            } else if (wepId === 'boomerang') {
                if(lv>=3) desc += "<br>Lv3: 雙向迴旋";
                if(lv>=10) desc += "<br>Lv10: 微型引力(吸引怪物)";
                if(lv>=15) desc += "<br>Lv15: 頂點滯空絞殺";
                if(lv>=20) desc += "<br>Lv20: 十字飛刃(四向齊發)";
                if(lv>=25) desc += "<br>Lv25: 奇異點(秒殺殘血)";
                if(lv>=50) desc += "<br>Lv50: 風暴之眼";
            } else if (wepId === 'shotgun') {
                if(lv>=3) desc += "<br>Lv3: 彈片增加";
                if(lv>=5) desc += "<br>Lv5: 擊退力大幅提升";
                if(lv>=10) desc += "<br>Lv10: 獲得穿透力";
                if(lv>=15) desc += "<br>Lv15: 爆破霰彈(命中引爆)";
                if(lv>=20) desc += "<br>Lv20: 射速倍增";
                if(lv>=25) desc += "<br>Lv25: 毀滅衝擊波(巨型)";
                if(lv>=50) desc += "<br>Lv50: 清道夫(全螢幕擊退)";
            } else if (wepId === 'wand') {
                if(lv>=3) desc += "<br>Lv3: 魔法球分裂(+2)";
                if(lv>=5) desc += "<br>Lv5: 飛行加速";
                if(lv>=10) desc += "<br>Lv10: 毒霧尾跡";
                if(lv>=15) desc += "<br>Lv15: 命中二次分裂";
                if(lv>=20) desc += "<br>Lv20: 觸發隕石打擊";
                if(lv>=25) desc += "<br>Lv25: 命中觸發黑洞";
                if(lv>=50) desc += "<br>Lv50: 魔法洪流";
            } else if (wepId === 'shuriken') {
                if(lv>=3) desc += "<br>Lv3: 彈跳次數增加";
                if(lv>=5) desc += "<br>Lv5: 附帶毒素";
                if(lv>=10) desc += "<br>Lv10: 殘影連擊(機率丟三把)";
                if(lv>=15) desc += "<br>Lv15: 體積增大";
                if(lv>=20) desc += "<br>Lv20: 致命暴擊率提升";
                if(lv>=25) desc += "<br>Lv25: 迴旋切割(命中停留)";
                if(lv>=50) desc += "<br>Lv50: 八岐大蛇(八向發射無限穿透)";
            } else if (wepId === 'missile') {
                if(lv>=3) desc += "<br>Lv3: 爆炸範圍增大";
                if(lv>=5) desc += "<br>Lv5: 速度提升";
                if(lv>=10) desc += "<br>Lv10: 子母彈(命中分裂3顆)";
                if(lv>=15) desc += "<br>Lv15: 極限追蹤";
                if(lv>=20) desc += "<br>Lv20: 彈頭數量+1";
                if(lv>=25) desc += "<br>Lv25: 燃燒彈頭(留下火海)";
                if(lv>=50) desc += "<br>Lv50: 天基動能打擊(觸發十字光束)";
            }
            return desc === "" ? "尚未解鎖特殊效果" : desc;
        }

        const availableSkills = [
            { id: 'multishot', name: '連續射擊', desc: '全部發射多射一波，每級冷卻增加20%', maxLv: 10, getEffect: (lv)=>`波數 +${lv}, 冷卻 +${lv*20}%` },
            { id: 'front_arrow', name: '正向箭+1', desc: '前方多射一箭', maxLv: 10, getEffect: (lv)=>`正向發射物 +${lv}` },
            { id: 'diag_arrow', name: '斜向箭+1', desc: '斜向多射各一箭', maxLv: 10, getEffect: (lv)=>`斜向發射物 +${lv*2}` },
            { id: 'side_arrow', name: '兩側箭+1', desc: '左右方多射各一箭', maxLv: 10, getEffect: (lv)=>`兩側發射物 +${lv*2}` },
            { id: 'rear_arrow', name: '背向箭+1', desc: '後方多射一箭', maxLv: 10, getEffect: (lv)=>`背向發射物 +${lv}` },
            { id: 'wall_bounce', name: '反彈牆壁', desc: '發射物可反彈邊緣(每次傷害減半)', maxLv: 10, getEffect: (lv)=>`反彈次數 +${lv*4}` },
            { id: 'ricochet', name: '彈射', desc: '擊中怪物後彈向下一隻', maxLv: 10, getEffect: (lv)=>`彈跳次數 +${lv*6}` },
            { id: 'pierce_up', name: '穿透強化', desc: '所有武器穿透力增加', maxLv: 10, getEffect: (lv)=>`穿透次數 +${lv*2}` },
            { id: 'cooldown', name: '攻速強化', desc: '減少武器基礎冷卻時間', maxLv: 10, getEffect: (lv)=>`冷卻減少 ${lv*8}%` },

        // --- Classes ---
        class Player {
            constructor() {
                this.x = mapSize.width / 2;
                this.y = mapSize.height / 2;
                this.radius = 15;
                this.baseSpeed = 4;
                
                this.level = 1; this.xp = 0; this.nextXp = 10;
                this.baseHp = 50 * (difficulty >= 100 ? 10 : difficulty >= 25 ? 5 : difficulty >= 5 ? 2 : 1);
                this.maxHp = this.baseHp; this.hp = this.baseHp;
                
                this.kills = 0; this.baseAttack = 1; 
                this.weapons = [{ ...weaponsDb[0], level: 1 }]; 
                this.currentWeaponIdx = 0; this.weaponCooldown = 0;
                this.skills = {};
                
                this.invulnTimer = 0; this.regenTimer = 0;
                this.shieldTimer = 0; this.hasShield = false;
                this.meteorTimer = 0; this.laserTimer = 0; this.novaTimer = 0; this.blackHoleTimer = 0;
                this.timeFreezeTimer = 0; this.holyTimer = 0; this.spiritTimer = 0; this.toxicTimer = 0;
                this.rouletteTimer = 0; this.currentBuff = null;

                this.attackQueue = 0; this.burstTimer = 0; this.target = null;
            }

            getStat(skillId) { return this.skills[skillId] || 0; }

            get damage() { return this.baseAttack + this.kills; }
            get speed() { 
                let spd = this.baseSpeed * (1 + (this.getStat('spd_up') * 0.1)); 
                if (this.currentBuff === 'speed') spd *= 1.5;
                return spd;
            }
            get pickupRange() { return 60 * (1 + (this.getStat('pickup') * 0.5)); }
            get actualMaxHp() { return (this.baseHp + (this.level * 15)) * (1 + (this.getStat('hp_up') * 0.3)); }

            update() {
                let dx = 0, dy = 0;
                if (joystick.active) { dx = joystick.deltaX; dy = joystick.deltaY; } 
                else {
                    if (keys.w || keys.ArrowUp) dy -= 1;
                    if (keys.s || keys.ArrowDown) dy += 1;
                    if (keys.a || keys.ArrowLeft) dx -= 1;
                    if (keys.d || keys.ArrowRight) dx += 1;
                }

                if (dx !== 0 || dy !== 0) {
                    let len = Math.hypot(dx, dy);
                    if (len > 1) { dx /= len; dy /= len; }
                    this.x += dx * this.speed; this.y += dy * this.speed;
                }

                this.x = Math.max(this.radius, Math.min(mapSize.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(mapSize.height - this.radius, this.y));

                if (this.invulnTimer > 0) this.invulnTimer--;
                
                if (this.getStat('regen') > 0) {
                    this.regenTimer++;
                    if (this.regenTimer >= 60) { this.heal(this.getStat('regen') * 4); this.regenTimer = 0; }
                }

                if (this.getStat('shield') > 0 && !this.hasShield) {
                    this.shieldTimer++;
                    let reqTime = Math.max(5, 25 - this.getStat('shield')*2) * 60;
                    if (this.shieldTimer >= reqTime) { this.hasShield = true; this.shieldTimer = 0; }
                }

                this.processUltimates();
                this.processOrbs();

                if (this.attackQueue > 0) {
                    this.burstTimer++;
                    let fireRate = this.currentBuff === 'rapid' ? 2 : 5;
                    if (this.burstTimer >= fireRate) { 
                        this.fireVolley(); this.attackQueue--; this.burstTimer = 0; 
                    }
                } else if (this.weaponCooldown > 0) {
                    this.weaponCooldown--;
                } else {
                    this.attack();
                }

                if (this.maxHp !== this.actualMaxHp) {
                    let ratio = this.hp / this.maxHp;
                    this.maxHp = this.actualMaxHp;
                    this.hp = Math.min(this.maxHp, this.maxHp * ratio); 
                }
                
                camera.x = this.x - (width / 2) / ZOOM;
                camera.y = this.y - (height / 2) / ZOOM;
            }

            processUltimates() {
                if (this.getStat('meteor') > 0) {
                    this.meteorTimer++;
                    if (this.meteorTimer >= 300) { 
                        let count = Math.ceil(this.getStat('meteor') / 2);
                        for(let i=0; i<count; i++) {
                            if (enemies.length > 0) {
                                let inViewE = enemies.filter(e => inView(e.x, e.y, 200));
                                if(inViewE.length > 0) {
                                    let target = inViewE[Math.floor(Math.random() * inViewE.length)];
                                    let mRadius = 120 + this.getStat('meteor') * 20;
                                    visualEffects.push({ type: 'meteor', x: target.x, y: target.y, timer: 30, radius: mRadius, dmg: this.damage * 2, player: this });
                                }
                            }
                        }
                        this.meteorTimer = 0;
                    }
                }
                if (this.getStat('laser') > 0) {
                    this.laserTimer++;
                    if (this.laserTimer >= 420) { 
                        if (enemies.length > 0) {
                            let inViewE = enemies.filter(e => inView(e.x, e.y, 200));
                            if(inViewE.length > 0) {
                                let target = inViewE[Math.floor(Math.random() * inViewE.length)];
                                let angle = Math.atan2(target.y - this.y, target.x - this.x);
                                let lWidth = 60 + this.getStat('laser') * 30;
                                visualEffects.push({ type: 'laser', x: this.x, y: this.y, angle: angle, timer: 20, width: lWidth, dmg: this.damage * 3, player: this });
                            }
                        }
                        this.laserTimer = 0;
                    }
                }
                if (this.getStat('frost_nova') > 0) {
                    this.novaTimer++;
                    let req = Math.max(3, 15 - this.getStat('frost_nova')) * 60;
                    if (this.novaTimer >= req) {
                        let nRadius = 150 + this.getStat('frost_nova') * 25;
                        visualEffects.push({ type: 'nova', x: this.x, y: this.y, timer: 30, radius: nRadius, player: this });
                        this.novaTimer = 0;
                    }
                }
                if (this.getStat('black_hole') > 0) {
                    this.blackHoleTimer++;
                    if (this.blackHoleTimer >= 360) { 
                        if (enemies.length > 0) {
                            let inViewE = enemies.filter(e => inView(e.x, e.y, 200));
                            if(inViewE.length > 0) {
                                let target = inViewE[Math.floor(Math.random() * inViewE.length)];
                                let bhRadius = 150 + this.getStat('black_hole') * 40;
                                visualEffects.push({ type: 'blackhole', x: target.x, y: target.y, timer: 180, radius: bhRadius, pullForce: 3 + this.getStat('black_hole')*0.5, dmg: this.damage * 0.5, player: this, drawSize: 30 + this.getStat('black_hole')*5 });
                            }
                        }
                        this.blackHoleTimer = 0;
                    }
                }
                if (this.getStat('time_freeze') > 0) {
                    this.timeFreezeTimer++;
                    if (this.timeFreezeTimer >= 900) { 
                        let freezeTicks = (2 + this.getStat('time_freeze') * 0.4) * 60;
                        for (let e of enemies) if(inView(e.x, e.y, 200)) e.frozenTimer = freezeTicks;
                        visualEffects.push({type: 'text', x: this.x, y: this.y - 40, text: "❄️ 時光凝滯 ❄️", css: 'text-cyan-300 font-bold text-2xl'});
                        this.timeFreezeTimer = 0;
                    }
                }
                if (this.getStat('toxic_aura') > 0) {
                    this.toxicTimer++;
                    if(this.toxicTimer >= 15) {
                        visualEffects.push({ type: 'poison_cloud', x: this.x, y: this.y, timer: this.getStat('toxic_aura')*30, radius: 40, dmg: this.damage * 0.5, player: this });
                        this.toxicTimer = 0;
                    }
                }
                if (this.getStat('holy_aura') > 0) {
                    this.holyTimer++;
                    if (this.holyTimer >= 180) {
                        let pushDist = 50 + this.getStat('holy_aura') * 15;
                        visualEffects.push({ type: 'holy_nova', x: this.x, y: this.y, timer: 15, radius: 200 });
                        for (let e of enemies) {
                            if(!inView(e.x, e.y, 100)) continue;
                            let d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < 200) {
                                let a = Math.atan2(e.y - this.y, e.x - this.x);
                                e.x += Math.cos(a) * pushDist; e.y += Math.sin(a) * pushDist;
                            }
                        }
                        this.holyTimer = 0;
                    }
                }
                if (this.getStat('lucky_roulette') > 0) {
                    this.rouletteTimer++;
                    if (this.rouletteTimer >= 600) {
                        let buffs = ['speed', 'rapid', 'giant'];
                        this.currentBuff = buffs[Math.floor(Math.random() * buffs.length)];
                        visualEffects.push({type: 'text', x: this.x, y: this.y - 40, text: `幸運: ${this.currentBuff.toUpperCase()}!`, css: 'text-pink-400 font-bold text-2xl'});
                        setTimeout(() => { this.currentBuff = null; }, 3000);
                        this.rouletteTimer = 0;
                    }
                }
                if (this.getStat('storm_spirit') > 0) {
                    this.spiritTimer++;
                    let req = Math.max(20, 120 - this.getStat('storm_spirit') * 10);
                    if (this.spiritTimer >= req) {
                        if(enemies.length > 0) {
                            let inViewE = enemies.filter(e => inView(e.x, e.y, 100));
                            if(inViewE.length > 0) {
                                let target = inViewE[Math.floor(Math.random() * inViewE.length)];
                                if(Math.hypot(target.x - this.x, target.y - this.y) < 400) {
                                    visualEffects.push({ type: 'lightning', x1: this.x - 30, y1: this.y - 30, x2: target.x, y2: target.y, timer: 10 });
                                    target.takeDamage(this.damage, this, false, true);
                                }
                            }
                        }
                        this.spiritTimer = 0;
                    }
                }
            }

            processOrbs() {
                const orbTypes = ['fire_orb', 'poison_orb', 'ice_orb', 'wood_orb', 'lightning_orb'];
                let orbitTime = Date.now() / 1000;
                orbTypes.forEach((type, idx) => {
                    let lv = this.getStat(type);
                    if (lv > 0) {
                        let baseRadius = 60 + (idx * 30) + (lv * 20); 
                        let orbAngles = [orbitTime * 3 + (idx), orbitTime * 3 + (idx) + Math.PI];
                        orbAngles.forEach(ang => {
                            let ox = this.x + Math.cos(ang) * baseRadius; let oy = this.y + Math.sin(ang) * baseRadius;
                            for (let e of enemies) {
                                if(!inView(e.x, e.y, 50)) continue;
                                if (Math.hypot(e.x - ox, e.y - oy) < e.radius + 15) {
                                    if (!e.orbCooldowns) e.orbCooldowns = {};
                                    if (!e.orbCooldowns[type] || e.orbCooldowns[type] <= 0) {
                                        e.takeDamage(this.damage, this, false, true);
                                        if (type === 'fire_orb') e.applyStatus('fire', lv);
                                        if (type === 'poison_orb') e.applyStatus('poison', lv);
                                        if (type === 'ice_orb') e.frozenTimer = 30;
                                        e.orbCooldowns[type] = 30; 
                                    }
                                }
                            }
                        });
                    }
                });
            }

            attack() {
                if (enemies.length === 0) return;
                
                let nearest = null; let minDist = Infinity;
                let viewPad = Math.max(width, height) / ZOOM / 2; 
                for (let e of enemies) {
                    if(!inView(e.x, e.y, 100)) continue; 
                    let dist = Math.hypot(e.x - this.x, e.y - this.y);
                    if (dist < minDist && dist < viewPad) { minDist = dist; nearest = e; }
                }

                if (!nearest) return; 
                this.target = nearest; 
                
                let q = 1 + this.getStat('multishot'); 
                const wep = weaponsDb.find(w => w.id === this.weapons[this.currentWeaponIdx].id);
                const wepLv = this.weapons[this.currentWeaponIdx].level;
                
                if (wep.id === 'pistol') {
                    if (wepLv >= 5) q += 2; 
                    if (wepLv >= 20) q += 2; 
                    if (wepLv >= 50) q += 5;
                }
                if (wep.id === 'shuriken') {
                    if (wepLv >= 10 && Math.random() < 0.3) q += 2;
                }
                this.attackQueue = q; this.burstTimer = 0; 
            }

            fireVolley() {
                if (!this.target || this.target.hp <= 0 || !inView(this.target.x, this.target.y, 100)) {
                    let nearest = null; let minDist = Infinity; let viewPad = Math.max(width, height) / ZOOM / 2; 
                    for (let e of enemies) {
                        if(!inView(e.x, e.y, 100)) continue;
                        let dist = Math.hypot(e.x - this.x, e.y - this.y);
                        if (dist < minDist && dist < viewPad) { minDist = dist; nearest = e; }
                    }
                    this.target = nearest; if(!this.target) return;
                }

                let baseAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                let angles = [];

                const wepDb = weaponsDb.find(w => w.id === this.weapons[this.currentWeaponIdx].id);
                const wepLv = this.weapons[this.currentWeaponIdx].level;

                if (wepDb.id === 'shuriken' && wepLv >= 50) {
                    for(let i=0; i<8; i++) angles.push((Math.PI/4)*i);
                } else if (wepDb.id === 'missile' && wepLv >= 50 && this.attackQueue === 1) {
                    angles.push(baseAngle); 
                } else {
                    let frontCount = 1 + this.getStat('front_arrow');
                    for(let i=0; i<frontCount; i++) angles.push(baseAngle + (frontCount > 1 ? (i - (frontCount-1)/2) * 0.15 : 0));
                    
                    let diagCount = this.getStat('diag_arrow');
                    for(let i=0; i<diagCount; i++) { angles.push(baseAngle - 0.5 - i*0.1); angles.push(baseAngle + 0.5 + i*0.1); }
                    
                    let sideCount = this.getStat('side_arrow');
                    for(let i=0; i<sideCount; i++) { angles.push(baseAngle - Math.PI/2 - i*0.1); angles.push(baseAngle + Math.PI/2 + i*0.1); }
                    
                    let rearCount = this.getStat('rear_arrow');
                    for(let i=0; i<rearCount; i++) angles.push(baseAngle + Math.PI + (rearCount > 1 ? (i - (rearCount-1)/2) * 0.15 : 0));
                }

                let dmg = this.damage; 
                let pSpeed = wepDb.speed * (1 + (this.getStat('bullet_speed') * 0.2));
                let pierceCount = wepDb.pierce + (this.getStat('pierce_up') * 2); 
                let ricochetCount = this.getStat('ricochet') * 6; 
                let bounceCount = this.getStat('wall_bounce') * 4;
                let projSize = 1 + (this.getStat('bullet_size') * 0.4);

                if (this.currentBuff === 'giant') { projSize *= 2; dmg *= 1.5; }

                if (wepDb.id === 'pistol') {
                    if (wepLv >= 3) bounceCount += 3;
                    if (wepLv >= 50) { pierceCount += 5; projSize *= 1.5; }
                }
                if (wepDb.id === 'bow') {
                    if (wepLv >= 5) pierceCount = 999;
                }
                if (wepDb.id === 'shuriken') {
                    if (wepLv >= 3) ricochetCount += 3;
                    if (wepLv >= 15) projSize *= 1.5;
                    if (wepLv >= 50) pierceCount = 999;
                }
                if (wepDb.id === 'missile') {
                    if (wepLv >= 5) pSpeed *= 1.5;
                    if (wepLv >= 50) pSpeed *= 3;
                }
                
                let baseAngles = [...angles];
                if (wepDb.id === 'boomerang') {
                    if (wepLv >= 3) { for(let a of baseAngles) angles.push(a + Math.PI); }
                    if (wepLv >= 20) { for(let a of baseAngles) { angles.push(a + Math.PI/2); angles.push(a - Math.PI/2); } }
                    if (wepLv >= 50) { for(let a of baseAngles) { angles.push(a + Math.PI/4); angles.push(a - Math.PI/4); } }
                    if (wepLv >= 10) projSize += 1; 
                }
                if (wepDb.id === 'shotgun') {
                    let pellets = 3 + (wepLv >= 3 ? 2 : 0) + (wepLv >= 50 ? 5 : 0);
                    let newAngles = [];
                    for(let a of baseAngles) {
                        let spread = wepLv >= 50 ? 0.4 : 0.2;
                        for(let i=0; i<pellets; i++) newAngles.push(a + (i - (pellets-1)/2)*spread);
                    }
                    angles = newAngles;
                    if(wepLv >= 10) pierceCount += 2;
                    if(wepLv >= 20) { let selfKb = 1; this.x -= Math.cos(baseAngle)*selfKb; this.y -= Math.sin(baseAngle)*selfKb; }
                    if(wepLv >= 25) { projSize *= 3; pierceCount = 999; }
                    if(wepLv >= 50) { projSize *= 2; }
                }
                if (wepDb.id === 'wand') {
                    if (wepLv >= 3) { for(let a of baseAngles) { angles.push(a + 0.3); angles.push(a - 0.3); } }
                    if (wepLv >= 50) { for(let a of baseAngles) { angles.push(a + 0.6); angles.push(a - 0.6); } pierceCount += 2; }
                }

                let baseCritRate = this.getStat('crit_rate') * 0.10;
                let woodLv = this.getStat('wood_ench');
                if(woodLv > 0) baseCritRate += Math.min(0.2, woodLv * 0.02);
                if(wepDb.id === 'shuriken' && wepLv >= 20) baseCritRate += 0.3;
                
                let critDmgMult = 1.5 + (this.getStat('crit_dmg') * 0.4);
                if(woodLv > 0) critDmgMult += 0.4;

                let cdReduc = Math.min(0.8, this.getStat('cooldown') * 0.08); 
                let berserkLv = this.getStat('berserk');
                if (berserkLv > 0) { cdReduc += (1 - this.hp/this.maxHp) * (berserkLv * 0.1); }
                
                let multiPen = 1 + (this.getStat('multishot') * 0.20);
                this.weaponCooldown = Math.max(5, wepDb.cooldown * (1 - cdReduc) * multiPen);
                if (wepDb.id === 'shotgun' && wepLv >= 20) this.weaponCooldown *= 0.5;

                for(let a of angles) {
                    let isCrit = false; let fDmg = dmg; 
                    if (Math.random() < baseCritRate) { isCrit = true; fDmg *= critDmgMult; }
                    projectiles.push(new Projectile(this.x, this.y, a, pSpeed, fDmg, pierceCount, ricochetCount, bounceCount, projSize, wepDb.type, wepDb.color, isCrit, this, wepDb.id, wepLv));
                }
            }

            heal(amt) {
                if(this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + amt);
                    visualEffects.push({type: 'text', x: this.x, y: this.y - 20, text: "+" + formatNum(amt), css: 'heal-text'});
                }
            }

            takeDamage(amt) {
                if (this.invulnTimer > 0) return;
                
                if (this.hasShield) {
                    this.hasShield = false;
                    visualEffects.push({type: 'text', x: this.x, y: this.y - 20, text: "護盾抵擋", css: 'text-blue-300 text-xl font-bold'});
                    this.invulnTimer = 60;
                    return;
                }

                let evadeRate = Math.min(0.6, this.getStat('evade') * 0.06);
                if (Math.random() < evadeRate) {
                    visualEffects.push({type: 'text', x: this.x, y: this.y - 20, text: "MISS", css: 'text-gray-300'});
                    this.invulnTimer = 20; 
                    
                    if (this.getStat('mirage_clone') > 0) {
                        visualEffects.push({ type: 'mirage', x: this.x, y: this.y, timer: 30 });
                        for(let i=0; i<8; i++) {
                            projectiles.push(new Projectile(this.x, this.y, (Math.PI/4)*i, 10, this.damage * (this.getStat('mirage_clone')*0.1), 0, 0, 0, 1, 'single', '#ffffff', false, this, 'mirage', 0));
                        }
                    }
                    return;
                }

                let armorReduc = Math.max(0.2, 1 - (this.getStat('armor') * 0.08));
                amt = Math.max(1, amt * armorReduc);
                
                this.hp -= amt;
                this.invulnTimer = 120; 
                
                visualEffects.push({type: 'text', x: this.x, y: this.y - 40, text: "-" + formatNum(amt), css: 'player-dmg-text'});
                document.getElementById('uiHp').parentElement.classList.add('animate-pulse');
                setTimeout(()=>document.getElementById('uiHp').parentElement.classList.remove('animate-pulse'), 500);

                if (this.getStat('thorns') > 0) {
                    let refDmg = amt * (this.getStat('thorns') * 1.0);
                    for(let e of enemies) {
                        if(inView(e.x, e.y, 100)) {
                            if (Math.hypot(e.x - this.x, e.y - this.y) < 150) e.takeDamage(refDmg, this, false);
                        }
                    }
                }
                
                if (this.getStat('blood_sac') > 0) {
                    let r = 150 + this.getStat('blood_sac') * 30;
                    visualEffects.push({ type: 'blood_nova', x: this.x, y: this.y, timer: 20, radius: r });
                    for(let e of enemies) { if(inView(e.x, e.y, r) && Math.hypot(e.x - this.x, e.y - this.y) < r) e.takeDamage(this.damage * 3, this, false); }
                }

                if (this.getStat('frost_armor') > 0) {
                    let r = 200 + this.getStat('frost_armor') * 20;
                    visualEffects.push({ type: 'frost_armor_nova', x: this.x, y: this.y, timer: 15, radius: r });
                    for(let e of enemies) { if(inView(e.x, e.y, r) && Math.hypot(e.x - this.x, e.y - this.y) < r) e.frozenTimer = 120; }
                }

                if (this.hp <= 0) { this.hp = 0; triggerGameOver(); }
            }

            draw(ctx) {
                let currentRadius = this.radius - (this.getStat('size_down') * 2);
                if (this.currentBuff === 'giant') currentRadius *= 1.5;

                ctx.save();
                ctx.translate(Math.round(this.x), Math.round(this.y)); 
                
                if (this.invulnTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) ctx.globalAlpha = 0.5;

                ctx.beginPath(); ctx.arc(0, 0, Math.round(currentRadius), 0, Math.PI * 2);
                ctx.fillStyle = '#4299e1'; ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = '#2b6cb0'; ctx.stroke();
                
                if (this.hasShield) {
                    ctx.beginPath(); ctx.arc(0, 0, Math.round(currentRadius + 10), 0, Math.PI*2);
                    ctx.strokeStyle = '#63b3ed'; ctx.lineWidth = 3; ctx.setLineDash([5, 5]); ctx.stroke();
                    ctx.setLineDash([]);
                }
                if (this.getStat('storm_spirit') > 0) {
                    ctx.beginPath(); ctx.arc(-25, -25, Math.max(1, Math.round(6 + Math.sin(Date.now()/200)*3)), 0, Math.PI*2);
                    ctx.fillStyle = '#ecc94b'; ctx.fill();
                }

                const orbTypes = ['fire_orb', 'poison_orb', 'ice_orb', 'wood_orb', 'lightning_orb'];
                const colors = { 'fire_orb': '#f56565', 'poison_orb': '#48bb78', 'ice_orb': '#63b3ed', 'wood_orb': '#38a169', 'lightning_orb': '#ecc94b' };
                let orbitTime = Date.now() / 1000;
                orbTypes.forEach((type, idx) => {
                    let lv = this.getStat(type);
                    if (lv > 0) {
                        let baseRadius = 60 + (idx * 30) + (lv * 20);
                        let orbAngles = [orbitTime * 3 + (idx), orbitTime * 3 + (idx) + Math.PI];
                        orbAngles.forEach(ang => {
                            ctx.beginPath(); ctx.arc(Math.round(Math.cos(ang) * baseRadius), Math.round(Math.sin(ang) * baseRadius), 8, 0, Math.PI*2);
                            ctx.fillStyle = colors[type]; ctx.fill(); 
                        });
                    }
                });

                let screenCx = width / 2; let screenCy = height / 2;
                let angle = Math.atan2(mouse.y - screenCy, mouse.x - screenCx);
                ctx.beginPath(); ctx.moveTo(0,0);
                ctx.lineTo(Math.round(Math.cos(angle) * (currentRadius+15)), Math.round(Math.sin(angle) * (currentRadius+15)));
                ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();

                ctx.restore();
            }
        }

        class Enemy {
            constructor(type, x, y, diff) {
                this.x = x; this.y = y; this.type = type;
                
                let scale = 0.5 + Math.random(); 
                let hpGrowth = 1; let dmgGrowth = 1;
                
                if (type === 'boss') { scale = 4.0; hpGrowth = 10 * diff; dmgGrowth = Math.sqrt(diff) * 2; }
                else { hpGrowth = Math.max(1, gameTime / 60) * diff; dmgGrowth = Math.max(1, Math.sqrt(gameTime/60)) * Math.sqrt(diff); }

                switch(type) {
                    case 'swarm': this.baseHp = 2; this.speed = 3.5; this.dmg = 5; this.radius = 8; this.color = `#${Math.floor(Math.random()*16777215).toString(16)}`; this.xp = 5; break;
                    case 'swarm_mini': this.baseHp = 1; this.speed = 4.0; this.dmg = 3; this.radius = 5; this.color = `#e53e3e`; this.xp = 2; break;
                    case 'dasher': this.baseHp = 8; this.speed = 5.0; this.dmg = 8; this.radius = 10; this.color = `hsl(20, 80%, 50%)`; this.xp = 12; break;
                    case 'brute': this.baseHp = 50; this.speed = 0.8; this.dmg = 25; this.radius = 25; this.color = `hsl(200, 30%, 40%)`; this.xp = 40; scale = Math.max(1.2, scale); break;
                    case 'bat': this.baseHp = 3; this.speed = 6.0; this.dmg = 5; this.radius = 6; this.color = '#718096'; this.xp = 8; break;
                    case 'bomber': this.baseHp = 15; this.speed = 3.0; this.dmg = 30; this.radius = 14; this.color = '#ed8936'; this.xp = 20; break;
                    case 'shooter': this.baseHp = 20; this.speed = 1.5; this.dmg = 15; this.radius = 16; this.color = '#9f7aea'; this.xp = 25; this.shootCooldown = 120; break;
                    case 'splitter': this.baseHp = 15; this.speed = 1.5; this.dmg = 12; this.radius = 16; this.color = `#3182ce`; this.xp = 20; break;
                    case 'splitter_mini': this.baseHp = 3; this.speed = 4.0; this.dmg = 8; this.radius = 8; this.color = `#63b3ed`; this.xp = 5; break;
                    case 'tank': this.baseHp = 30; this.speed = 1.0; this.dmg = 25; this.radius = 20; this.color = `hsl(0, 50%, 30%)`; this.xp = 30; break;
                    case 'golem': this.baseHp = 80; this.speed = 0.8; this.dmg = 40; this.radius = 28; this.color = `hsl(30, 40%, 40%)`; this.xp = 60; scale = Math.max(1.0, scale); break;
                    case 'teleporter': this.baseHp = 12; this.speed = 2.5; this.dmg = 15; this.radius = 10; this.color = '#2b6cb0'; this.xp = 25; this.tpCooldown = 180; break;
                    case 'spawner': this.baseHp = 60; this.speed = 1.0; this.dmg = 20; this.radius = 25; this.color = '#276749'; this.xp = 40; this.spawnCooldown = 120; break;
                    case 'boss': this.baseHp = 5000; this.speed = 1.8; this.dmg = 150; this.radius = 60; this.color = '#9b2c2c'; this.xp = 1000; this.isBoss = true; scale = 1; break;
                    default: this.baseHp = 5; this.speed = 2; this.dmg = 10; this.radius = 12; this.color = `hsl(140, 60%, 50%)`; this.xp = 10;
                }

                this.radius = this.radius * scale;
                this.hp = this.baseHp * hpGrowth * (scale * 0.8);
                this.maxHp = this.hp;
                this.dmg = this.dmg * dmgGrowth; 
                this.speed = this.speed * (1 / Math.sqrt(scale));

                this.knockbackX = 0; this.knockbackY = 0;
                this.frozenTimer = 0; this.paralyzeTimer = 0;
                this.statusEffects = {}; 
                this.judgementTimer = 0;
            }

            applyStatus(type, lv) {
                if (!this.statusEffects[type]) this.statusEffects[type] = { lv: 0, timer: 0 };
                this.statusEffects[type].lv = Math.max(this.statusEffects[type].lv, lv);
                this.statusEffects[type].timer = 120; 
            }

            takeDamage(dmg, srcPlayer, isCrit, bypassExec = false) {
                this.hp -= dmg;

                if (!bypassExec && !this.isBoss && srcPlayer && srcPlayer.getStat('execution') > 0) {
                    if ((this.hp / this.maxHp) <= 0.10) {
                        let execChance = srcPlayer.getStat('execution') * 0.04;
                        if (Math.random() < execChance) {
                            this.hp = 0;
                            if(inView(this.x, this.y, 50)) visualEffects.push({type:'text', x:this.x, y:this.y-20, text:"處決!", css:'text-purple-500 font-black text-2xl'});
                        }
                    }
                }

                if (this.hp <= 0) killEnemy(this, srcPlayer);
            }

            update(player, diffMult) {
                if (this.hp <= 0) return;
                
                // Sleep if too far
                if (!inView(this.x, this.y, 1000)) return;

                if (this.orbCooldowns) { for(let k in this.orbCooldowns) if(this.orbCooldowns[k] > 0) this.orbCooldowns[k]--; }

                for (let type in this.statusEffects) {
                    let effect = this.statusEffects[type];
                    if (effect.timer > 0) {
                        effect.timer--;
                        if (effect.timer % 60 === 0) { 
                            if (type === 'fire') this.takeDamage(player.damage * Math.min(0.15, effect.lv*0.02), player, false, true);
                            if (type === 'poison' && Math.random() < 0.5) this.takeDamage(player.damage * Math.min(0.15, effect.lv*0.02), player, false, true);
                        }
                    }
                }

                if (this.judgementTimer > 0) {
                    this.judgementTimer--;
                    if(this.judgementTimer === 0) {
                        if(inView(this.x, this.y, 100)) visualEffects.push({ type: 'lightning_strike', x: this.x, y: this.y, timer: 15 });
                        this.takeDamage(player.damage * 10, player, true, true);
                    }
                }

                let distToPlayer = Math.hypot(this.x - player.x, this.y - player.y);

                if (this.type === 'bomber' && distToPlayer < this.radius + player.radius + 20) {
                    if(inView(this.x, this.y, 100)) visualEffects.push({ type: 'explosion', x: this.x, y: this.y, radius: 100, timer: 15 });
                    player.takeDamage(this.dmg);
                    for(let e of enemies) if (e !== this && Math.hypot(e.x - this.x, e.y - this.y) < 100) e.takeDamage(this.dmg*3, null, false, true);
                    this.hp = 0; return;
                }
                if (this.type === 'shooter' && this.frozenTimer <= 0) {
                    this.shootCooldown--;
                    if (this.shootCooldown <= 0 && distToPlayer < 600) {
                        let a = Math.atan2(player.y - this.y, player.x - this.x);
                        enemyProjectiles.push(new EnemyProj(this.x, this.y, a, 5, this.dmg));
                        this.shootCooldown = 120;
                    }
                    if (distToPlayer < 300) { this.speed = 0; } else { this.speed = 1.5; } 
                }
                if (this.type === 'teleporter' && this.frozenTimer <= 0) {
                    this.tpCooldown--;
                    if (this.tpCooldown <= 0) {
                        let a = Math.random() * Math.PI * 2;
                        this.x = player.x + Math.cos(a) * 150;
                        this.y = player.y + Math.sin(a) * 150;
                        this.tpCooldown = 240;
                        if(inView(this.x, this.y, 50)) visualEffects.push({ type: 'explosion', x: this.x, y: this.y, radius: 40, timer: 10 });
                    }
                }
                if (this.type === 'spawner' && this.frozenTimer <= 0) {
                    this.spawnCooldown--;
                    if (this.spawnCooldown <= 0 && distToPlayer < 600) {
                        for(let i = 0; i < 2; i++) {
                            enemies.push(new Enemy('swarm_mini', this.x + (Math.random()-0.5)*30, this.y + (Math.random()-0.5)*30, diffMult));
                        }
                        this.spawnCooldown = 240;
                    }
                    if (distToPlayer < 350) { this.speed = 0; } else { this.speed = 1.0; }
                }

                if (this.paralyzeTimer > 0) { this.paralyzeTimer--; } 
                else if (Math.abs(this.knockbackX) > 0.1 || Math.abs(this.knockbackY) > 0.1) {
                    this.x += this.knockbackX; this.y += this.knockbackY;
                    this.knockbackX *= 0.8; this.knockbackY *= 0.8;
                } else {
                    let angle = Math.atan2(player.y - this.y, player.x - this.x);
                    if (this.type === 'phantom') angle += Math.sin(gameTime * 5 + this.offset) * 0.5;
                    let slowMult = 1;
                    if (this.frozenTimer > 0) { slowMult = 0.2; this.frozenTimer--; }
                    if (player.getStat('blizzard') > 0) slowMult *= (1 - player.getStat('blizzard')*0.05);
                    
                    this.x += Math.cos(angle) * this.speed * slowMult;
                    this.y += Math.sin(angle) * this.speed * slowMult;
                }
                
                if (distToPlayer < this.radius + player.radius) player.takeDamage(this.dmg);
            }

            draw(ctx) {
                if (!inView(this.x, this.y, this.radius + 10)) return;

                ctx.save(); ctx.translate(Math.round(this.x), Math.round(this.y));
                
                if (this.isGhost) ctx.globalAlpha = 0.6;
                if (this.frozenTimer > 0) ctx.fillStyle = '#63b3ed'; 
                else if (this.statusEffects['fire'] && this.statusEffects['fire'].timer > 0) ctx.fillStyle = '#f56565';
                else if (this.statusEffects['poison'] && this.statusEffects['poison'].timer > 0) ctx.fillStyle = '#48bb78';
                else if (this.paralyzeTimer > 0) ctx.fillStyle = '#ecc94b';
                else ctx.fillStyle = this.color;

                if (this.isBoss) { ctx.shadowBlur = 20; ctx.shadowColor = 'red'; }

                ctx.beginPath(); ctx.arc(0, 0, Math.round(this.radius), 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#1a202c'; ctx.lineWidth = 2; ctx.stroke();

                if (this.hp < this.maxHp && this.isBoss) { // Only draw boss HP bar for perf
                    let w = this.radius * 2; let h = 6;
                    ctx.fillStyle = '#000'; ctx.fillRect(-w/2, -this.radius - 12, w, h);
                    ctx.fillStyle = '#f56565'; ctx.fillRect(-w/2, -this.radius - 12, w * (this.hp / this.maxHp), h);
                }
                ctx.restore();
            }
        }

        class EnemyProj {
            constructor(x, y, angle, speed, dmg) {
                this.x = x; this.y = y; this.angle = angle; this.speed = speed; this.dmg = dmg; this.active = true;
            }
            update(player) {
                this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed;
                if (Math.hypot(this.x - player.x, this.y - player.y) < player.radius + 5) { player.takeDamage(this.dmg); this.active = false; }
                if (!inView(this.x, this.y, 50)) this.active = false;
            }
            draw(ctx) {
                if (!inView(this.x, this.y, 10)) return;
                ctx.save(); ctx.translate(Math.round(this.x), Math.round(this.y));
                ctx.fillStyle = '#9f7aea'; ctx.beginPath(); ctx.arc(0,0, 6, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle, speed, dmg, pierce, ricochet, bounce, sizeMult, type, color, isCrit, playerRef, wepId, wepLv, target=null) {
                this.x = x; this.y = y; this.startX = x; this.startY = y; this.angle = angle; this.speed = speed; this.dmg = dmg;
                this.pierceCount = pierce; this.ricochetCount = ricochet; this.bounceCount = bounce; this.sizeMult = sizeMult;
                this.type = type; this.color = color; this.isCrit = isCrit; this.player = playerRef;
                this.wepId = wepId; this.wepLv = wepLv; this.homingTarget = target;
                this.active = true; this.hitEnemies = new Set(); this.returning = false;
                this.splitDone = false; this.isPhantom = false; this.spinTimer = 0; this.spun = false;
                this.hoverTimer = 0;
            }

            update() {
                if (!inView(this.x, this.y, 200)) { this.active = false; return; }

                if (this.wepId === 'missile' && this.homingTarget && this.homingTarget.hp > 0 && this.active) {
                    let targetAngle = Math.atan2(this.homingTarget.y - this.y, this.homingTarget.x - this.x);
                    let angleDiff = targetAngle - this.angle;
                    while(angleDiff <= -Math.PI) angleDiff += Math.PI*2;
                    while(angleDiff > Math.PI) angleDiff -= Math.PI*2;
                    let turnSpeed = this.wepLv >= 15 ? 0.2 : 0.05;
                    this.angle += angleDiff * turnSpeed; 
                }
                else if (this.wepId === 'bow' && this.wepLv >= 10 && this.active && this.type !== 'return') {
                    let nearest = null; let minD = 300;
                    for(let e of enemies) {
                        if (!this.hitEnemies.has(e) && e.hp > 0 && inView(e.x, e.y, 100)) {
                            let d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < minD) { minD = d; nearest = e; }
                        }
                    }
                    if (nearest) {
                        let targetAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                        let angleDiff = targetAngle - this.angle;
                        while(angleDiff <= -Math.PI) angleDiff += Math.PI*2;
                        while(angleDiff > Math.PI) angleDiff -= Math.PI*2;
                        this.angle += angleDiff * 0.1; 
                    }
                }

                if (this.wepId === 'bow' && this.wepLv >= 20 && !this.isPhantom && Math.random() < 0.05) {
                    let clone = new Projectile(this.x, this.y, this.angle + (Math.random()-0.5)*0.5, this.speed, this.dmg, this.pierceCount, 0, 0, this.sizeMult, this.type, this.color, this.isCrit, this.player, this.wepId, this.wepLv);
                    clone.isPhantom = true; clone.color = 'rgba(255,255,255,0.5)';
                    projectiles.push(clone);
                }

                if (this.wepId === 'wand') {
                    if (this.wepLv >= 5) this.speed *= 1.02;
                    if (this.wepLv >= 10 && Math.random() < 0.2) {
                        visualEffects.push({ type: 'poison_cloud', x: this.x, y: this.y, timer: 15, radius: 20, dmg: this.dmg*0.2, player: this.player });
                    }
                    let nearest = null; let minD = 500;
                    for(let e of enemies) {
                        if (!this.hitEnemies.has(e) && e.hp > 0 && inView(e.x, e.y, 100)) {
                            let d = Math.hypot(e.x - this.x, e.y - this.y);
                            if (d < minD) { minD = d; nearest = e; }
                        }
                    }
                    if (nearest) {
                        let targetAngle = Math.atan2(nearest.y - this.y, nearest.x - this.x);
                        let angleDiff = targetAngle - this.angle;
                        while(angleDiff <= -Math.PI) angleDiff += Math.PI*2;
                        while(angleDiff > Math.PI) angleDiff -= Math.PI*2;
                        this.angle += angleDiff * 0.1; 
                    }
                }

                if (this.wepId === 'boomerang' && this.wepLv >= 10 && this.active) {
                    for (let en of enemies) {
                        if (en.hp > 0 && inView(en.x, en.y, 100)) {
                            let dist = Math.hypot(en.x - this.x, en.y - this.y);
                            if (dist < 200 * this.sizeMult) {
                                let pullA = Math.atan2(this.y - en.y, this.x - en.x);
                                en.x += Math.cos(pullA) * 2; en.y += Math.sin(pullA) * 2;
                                if(this.wepLv >= 25 && en.hp / en.maxHp < 0.2 && !en.isBoss) { en.hp = 0; }
                            }
                        }
                    }
                }

                if (this.type === 'return') {
                    let distFromStart = Math.hypot(this.x - this.startX, this.y - this.startY);
                    let maxD = this.wepId === 'boomerang' && this.wepLv >= 50 ? 600 : 400;
                    if (!this.returning && distFromStart > maxD) { 
                        if (this.wepId === 'boomerang' && this.wepLv >= 15 && !this.spun) {
                            this.spinTimer = 120; this.spun = true;
                        } else if (this.spinTimer <= 0) {
                            this.returning = true; this.hitEnemies.clear(); 
                        }
                    }
                    if (this.spinTimer > 0) {
                        this.spinTimer--;
                        if (this.spinTimer % 10 === 0) this.hitEnemies.clear();
                    } else if (this.returning) {
                        let angleToPlayer = Math.atan2(this.player.y - this.y, this.player.x - this.x);
                        this.x += Math.cos(angleToPlayer) * this.speed * 1.5;
                        this.y += Math.sin(angleToPlayer) * this.speed * 1.5;
                        if (Math.hypot(this.x - this.player.x, this.y - this.player.y) < this.player.radius + 20) this.active = false;
                    } else {
                        this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed;
                    }
                } else if (this.hoverTimer > 0) {
                    this.hoverTimer--;
                    if(this.hoverTimer % 10 === 0) this.hitEnemies.clear();
                    if(this.hoverTimer <= 0) this.active = false;
                } else {
                    let nx = this.x + Math.cos(this.angle) * this.speed;
                    let ny = this.y + Math.sin(this.angle) * this.speed;
                    let outX = nx < camera.x || nx > camera.x + width/ZOOM; 
                    let outY = ny < camera.y || ny > camera.y + height/ZOOM;
                    
                    if (outX || outY) {
                        if (this.bounceCount > 0) {
                            if (outX) this.angle = Math.PI - this.angle;
                            if (outY) this.angle = -this.angle;
                            this.bounceCount--; this.hitEnemies.clear(); this.dmg *= 0.5; 
                            this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed;
                        } else { this.active = false; }
                    } else { this.x = nx; this.y = ny; }
                }

                for (let e of enemies) {
                    if (!this.hitEnemies.has(e) && e.hp > 0 && inView(e.x, e.y, 50)) {
                        let dist = Math.hypot(this.x - e.x, this.y - e.y);
                        if (dist < e.radius + 10 * this.sizeMult) { 
                            this.hitEnemies.add(e);
                            if (e.isGhost && Math.random() < 0.3) continue;
                            
                            e.takeDamage(this.dmg, this.player, this.isCrit);
                            
                            if (this.wepId === 'missile') {
                                let expR = this.wepLv >= 3 ? 100 : 50;
                                visualEffects.push({ type: 'explosion', x: this.x, y: this.y, radius: expR, timer: 10 });
                                for(let en of enemies) if(en!==e && inView(en.x, en.y, expR) && Math.hypot(en.x-this.x, en.y-this.y)<expR) en.takeDamage(this.dmg, this.player, false, true);
                                
                                if (this.wepLv >= 10 && !this.splitDone) {
                                    this.splitDone = true;
                                    for(let i=0; i<3; i++) {
                                        let nearby = enemies.filter(en => en !== e && en.hp > 0 && inView(en.x, en.y, 300));
                                        let t = nearby.length > 0 ? nearby[Math.floor(Math.random()*nearby.length)] : null;
                                        projectiles.push(new Projectile(this.x, this.y, this.angle+(Math.random()-0.5), this.speed, this.dmg*0.5, 0, 0, 0, this.sizeMult*0.5, 'explosive', this.color, false, this.player, 'missile', 0, t));
                                    }
                                }
                                if (this.wepLv >= 25) {
                                    visualEffects.push({ type: 'poison_cloud', x: this.x, y: this.y, timer: 180, radius: expR, dmg: this.dmg*0.2, player: this.player });
                                }
                                if (this.wepLv >= 50) {
                                    visualEffects.push({ type: 'laser', x: this.x, y: this.y, angle: 0, timer: 15, width: 80, dmg: this.dmg*5, player: this.player });
                                    visualEffects.push({ type: 'laser', x: this.x, y: this.y, angle: Math.PI/2, timer: 15, width: 80, dmg: this.dmg*5, player: this.player });
                                }
                                this.active = false; break;
                            }

                            if (this.wepId === 'shuriken' && this.wepLv >= 25 && this.hoverTimer === 0 && Math.random() < 0.3) {
                                this.hoverTimer = 60; this.hitEnemies.clear();
                            }
                            if (this.wepId === 'shuriken' && this.wepLv >= 5 && Math.random() < 0.5) e.applyStatus('poison', 5);

                            if (this.wepId === 'wand' && this.wepLv >= 15 && !this.splitDone) {
                                this.splitDone = true;
                                projectiles.push(new Projectile(this.x, this.y, this.angle + 0.5, this.speed, this.dmg*0.5, 0, 0, 0, this.sizeMult*0.8, this.type, this.color, false, this.player, 'wand', this.wepLv));
                                projectiles.push(new Projectile(this.x, this.y, this.angle - 0.5, this.speed, this.dmg*0.5, 0, 0, 0, this.sizeMult*0.8, this.type, this.color, false, this.player, 'wand', this.wepLv));
                            }
                            if (this.wepId === 'wand' && this.wepLv >= 20 && Math.random() < 0.1) {
                                visualEffects.push({ type: 'meteor', x: e.x, y: e.y, timer: 30, radius: 100, dmg: this.dmg * 2, player: this.player });
                            }
                            if (this.wepId === 'wand' && this.wepLv >= 25 && Math.random() < 0.05) {
                                visualEffects.push({ type: 'blackhole', x: e.x, y: e.y, timer: 60, radius: 150, pullForce: 4, dmg: this.dmg, player: this.player, drawSize: 40 });
                            }
                            if (this.wepId === 'wand' && this.wepLv >= 50 && Math.random() < 0.1) {
                                for(let i=0; i<4; i++) projectiles.push(new Projectile(this.x, this.y, (Math.PI/2)*i, this.speed*1.5, this.dmg*2, 999, 0, 0, this.sizeMult*2, 'homing', '#ffffff', true, this.player, 'wand', 0));
                            }

                            if (this.wepId === 'shotgun' && this.wepLv >= 15) {
                                visualEffects.push({ type: 'explosion', x: e.x, y: e.y, radius: 60, timer: 10 });
                                for(let en of enemies) if(en !== e && inView(en.x, en.y, 60) && Math.hypot(en.x - e.x, en.y - e.y) < 60) en.takeDamage(this.dmg * 0.5, this.player, false, true);
                            }
                            if (this.wepId === 'shotgun' && this.wepLv >= 50 && Math.random() < 0.05) {
                                visualEffects.push({ type: 'holy_nova', x: this.player.x, y: this.player.y, timer: 15, radius: 400 });
                                for(let en of enemies) if(inView(en.x, en.y, 400) && Math.hypot(en.x-this.player.x, en.y-this.player.y)<400) { en.knockbackX += Math.cos(this.angle)*20; en.knockbackY += Math.sin(this.angle)*20; }
                            }

                            if (this.wepId === 'bow' && this.wepLv >= 3 && !this.splitDone) {
                                this.splitDone = true;
                                projectiles.push(new Projectile(this.x, this.y, this.angle + Math.PI - 0.5, this.speed*0.8, this.dmg*0.5, 0, 0, 0, this.sizeMult*0.6, this.type, this.color, false, this.player, 'split', 0));
                                projectiles.push(new Projectile(this.x, this.y, this.angle + Math.PI + 0.5, this.speed*0.8, this.dmg*0.5, 0, 0, 0, this.sizeMult*0.6, this.type, this.color, false, this.player, 'split', 0));
                            }
                            if (this.wepId === 'bow' && this.wepLv >= 15) {
                                visualEffects.push({ type: 'arrow_rain', x: e.x, y: e.y, timer: 15, radius: 80 });
                                for(let en of enemies) if(en!==e && inView(en.x, en.y, 80) && Math.hypot(en.x - e.x, en.y - e.y)<80) en.takeDamage(this.dmg*0.5, this.player, false, true);
                            }
                            if (this.wepId === 'bow' && this.wepLv >= 25) e.judgementTimer = 60;
                            if (this.wepId === 'bow' && this.wepLv >= 50 && !this.splitDone && Math.random() < 0.2) {
                                this.splitDone = true;
                                for(let i=0; i<10; i++) projectiles.push(new Projectile(this.x, this.y, this.angle + (Math.random()-0.5)*2, this.speed, this.dmg, 999, 0, 0, this.sizeMult, 'pierce', '#ffcc00', true, this.player, 'split', 0));
                            }

                            if (this.wepId === 'pistol' && this.wepLv >= 10) {
                                let expRad = this.wepLv >= 25 ? 150 : 80;
                                if (this.wepLv >= 50) expRad = 250;
                                visualEffects.push({ type: 'explosion', x: e.x, y: e.y, radius: expRad, timer: 15 });
                                for (let en of enemies) {
                                    if (en !== e && inView(en.x, en.y, expRad) && Math.hypot(en.x - e.x, en.y - e.y) < expRad) en.takeDamage(this.dmg * (this.wepLv>=25?3:0.5), this.player, false, true); 
                                }
                                if(this.wepLv >= 15) {
                                    for(let i=0; i<4; i++) projectiles.push(new Projectile(this.x, this.y, (Math.PI/2)*i, this.speed, this.dmg*0.3, 1, 0, 0, this.sizeMult*0.5, 'single', '#ffaa00', false, this.player, 'split', 0));
                                }
                            }

                            if (this.player.getStat('fire_ench') > 0) e.applyStatus('fire', this.player.getStat('fire_ench'));
                            if (this.player.getStat('poison_ench') > 0) e.applyStatus('poison', this.player.getStat('poison_ench'));
                            if (this.player.getStat('ice_ench') > 0) e.applyStatus('ice', this.player.getStat('ice_ench'));
                            
                            let lLv = this.player.getStat('lightning_ench');
                            if (lLv > 0) {
                                let chainCount = lLv * 4; let currentTarget = e; let hitSet = new Set([e]);
                                for(let i=0; i<chainCount; i++) {
                                    let next = null; let minD = 200;
                                    for(let ne of enemies) {
                                        if(!hitSet.has(ne) && ne.hp > 0 && inView(ne.x, ne.y, 200)) {
                                            let d = Math.hypot(ne.x - currentTarget.x, ne.y - currentTarget.y);
                                            if(d < minD) { minD = d; next = ne; }
                                        }
                                    }
                                    if (next) {
                                        visualEffects.push({ type: 'lightning', x1: currentTarget.x, y1: currentTarget.y, x2: next.x, y2: next.y, timer: 10 });
                                        next.takeDamage(this.dmg * 0.5, this.player, false, true);
                                        next.paralyzeTimer = 30; hitSet.add(next); currentTarget = next;
                                    } else break;
                                }
                            }

                            let kbMultiplier = 1 + (this.player.getStat('knockback') * 1.0);
                            if (this.wepId === 'shotgun') kbMultiplier *= (this.wepLv >= 5 ? 3 : 1.5);
                            let kx = Math.cos(this.angle) * 3 * kbMultiplier;
                            let ky = Math.sin(this.angle) * 3 * kbMultiplier;
                            e.knockbackX = kx; e.knockbackY = ky;
                            
                            if (this.player.getStat('grav_collapse') > 0) {
                                let gravDmg = this.player.damage * (this.player.getStat('grav_collapse') * 0.5) * kbMultiplier;
                                e.takeDamage(gravDmg, this.player, false, true);
                            }

                            if (this.type !== 'return' && !this.isPhantom && this.hoverTimer <= 0) {
                                if (this.ricochetCount > 0) {
                                    this.ricochetCount--; let nextE = null; let minD = 300;
                                    for(let ne of enemies) {
                                        if (!this.hitEnemies.has(ne) && ne.hp > 0 && inView(ne.x, ne.y, 300)) {
                                            let d = Math.hypot(ne.x - e.x, ne.y - e.y);
                                            if (d < minD) { minD = d; nextE = ne; }
                                        }
                                    }
                                    if (nextE) { this.angle = Math.atan2(nextE.y - this.y, nextE.x - this.x); this.dmg *= 0.8; } 
                                    else { this.active = false; break; }
                                } else if (this.pierceCount > 0) {
                                    this.pierceCount--; this.dmg *= 0.8;
                                } else {
                                    this.active = false; break;
                                }
                            }
                        }
                    }
                }
            }

            draw(ctx) {
                if (!inView(this.x, this.y, 20)) return;
                ctx.save(); ctx.translate(Math.round(this.x), Math.round(this.y)); ctx.rotate(this.angle); ctx.scale(this.sizeMult, this.sizeMult);
                ctx.fillStyle = this.color;
                if (this.type === 'bow') { ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-10, -3); ctx.lineTo(-10, 3); ctx.fill(); } 
                else if (this.type === 'boomerang') {
                    ctx.rotate(Date.now() / 50); ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI, false);
                    ctx.lineWidth = 4; ctx.strokeStyle = this.color; ctx.stroke();
                } else if (this.wepId === 'shuriken') {
                    ctx.rotate(Date.now() / 20);
                    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(3, -2); ctx.lineTo(8, 0); ctx.lineTo(3, 2); ctx.lineTo(0, 8); ctx.lineTo(-3, 2); ctx.lineTo(-8, 0); ctx.lineTo(-3, -2); ctx.fill();
                } else if (this.wepId === 'missile') {
                    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -4); ctx.lineTo(-4, 0); ctx.lineTo(-6, 4); ctx.fill();
                    ctx.fillStyle = 'orange'; ctx.beginPath(); ctx.arc(-6, 0, 3, 0, Math.PI*2); ctx.fill();
                } else if (this.type === 'homing') {
                    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
                    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
                } else { ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); }
                ctx.restore();
            }
        }

        class Item {
            constructor(x, y, type, value) {
                this.x = x; this.y = y; this.type = type; this.value = value; this.active = true; this.magnetized = false;
            }
            update(player) {
                let dist = Math.hypot(this.x - player.x, this.y - player.y);
                if (dist < player.pickupRange) this.magnetized = true;
                if (this.magnetized) {
                    let angle = Math.atan2(player.y - this.y, player.x - this.x);
                    this.x += Math.cos(angle) * 15; this.y += Math.sin(angle) * 15;
                    if (dist < player.radius + 15) {
                        this.active = false;
                        if (player.getStat('coin_bomb') > 0 && Math.random() < player.getStat('coin_bomb') * 0.05) {
                            visualEffects.push({ type: 'explosion', x: this.x, y: this.y, radius: 100, timer: 15 });
                            for(let e of enemies) if(inView(e.x, e.y, 100) && Math.hypot(e.x-this.x, e.y-this.y)<100) e.takeDamage(player.damage*2, player, false, true);
                        }
