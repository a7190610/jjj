                        if (this.type === 'xp') gainXp(this.value);
                        else if (this.type === 'weapon') unlockOrUpgradeWeapon(this.value);
                        else if (this.type === 'health') player.heal(player.maxHp);
                        else if (this.type === 'magnet') { for(let i of items) if(i.type==='xp') i.magnetized = true; }
                        else if (this.type === 'diff_changer') { openDiffModal(); }
                    }
                }
            }
            draw(ctx) {
                if (!inView(this.x, this.y, 20)) return;
                ctx.save(); ctx.translate(Math.round(this.x), Math.round(this.y));
                if (this.type === 'xp') {
                    ctx.fillStyle = this.value > 50 ? '#ecc94b' : (this.value > 20 ? '#3182ce' : '#63b3ed'); 
                    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(6, 0); ctx.lineTo(0, 6); ctx.lineTo(-6, 0); ctx.fill();
                } else if (this.type === 'weapon') {
                    ctx.fillStyle = '#ecc94b'; ctx.fillRect(-8, -8, 16, 16);
                    ctx.strokeStyle = '#fff'; ctx.strokeRect(-8,-8,16,16);
                    ctx.fillStyle = 'black'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '10px Arial'; ctx.fillText('W', 0, 0);
                } else if (this.type === 'health') {
                    ctx.fillStyle = '#f56565'; ctx.beginPath(); ctx.arc(0,0, 10, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.fillRect(-2,-6, 4,12); ctx.fillRect(-6,-2, 12,4);
                } else if (this.type === 'magnet') {
                    ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(0,0, 10, Math.PI, 0); ctx.fill();
                    ctx.fillStyle = 'blue'; ctx.beginPath(); ctx.arc(0,0, 10, 0, Math.PI); ctx.fill();
                } else if (this.type === 'diff_changer') {
                    ctx.fillStyle = '#b83280'; ctx.fillRect(-10, -10, 20, 20);
                    ctx.strokeStyle = '#fff'; ctx.strokeRect(-10,-10,20,20);
                    ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '12px Arial'; ctx.fillText('D', 0, 0);
                }
                ctx.restore();
            }
        }

        let player; let enemies = []; let projectiles = []; let enemyProjectiles = []; let items = [];
        let uiContainer = document.getElementById('uiLayer');
        
        function initGame(selectedDiff) {
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            for (let k in keys) keys[k] = false;
            handleJoystickEnd(); 

            difficulty = selectedDiff || 5; player = new Player();
            enemies = []; projectiles = []; enemyProjectiles = []; items = []; visualEffects = [];
            gameTime = 0; levelUpQueue = 0; bossActive = false; nextBossTime = 300;
            bossPhase2Triggered = false; currentBoss = null;
            
            document.querySelectorAll('.player-dmg-text, .heal-text').forEach(e => e.remove());
            
            updateWeaponUI(); updateStatsUI();
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            
            document.getElementById('uiDiffText').innerText = `自訂 (x${difficulty})`;
            if(difficulty===1) document.getElementById('uiDiffText').innerText = "簡單 (x1)";
            if(difficulty===5) document.getElementById('uiDiffText').innerText = "普通 (x5)";
            if(difficulty===25) document.getElementById('uiDiffText').innerText = "困難 (x25)";
            if(difficulty===100) document.getElementById('uiDiffText').innerText = "地獄 (x100)";
            
            gameState = 'playing'; lastTime = performance.now();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function spawnBoss() {
            let angle = Math.random() * Math.PI * 2;
            let sx = player.x + Math.cos(angle) * 800; let sy = player.y + Math.sin(angle) * 800;
            sx = Math.max(100, Math.min(mapSize.width-100, sx)); sy = Math.max(100, Math.min(mapSize.height-100, sy));
            let b = new Enemy('boss', sx, sy, difficulty);
            enemies.push(b);
            currentBoss = b;
            bossActive = true;
            bossPhase2Triggered = false;
            document.getElementById('uiTime').parentElement.classList.add('boss-warning');
            
            for(let i=0; i<100; i++) spawnEnemy(true);
        }

        function spawnEnemy(force = false) {
            let maxEnemies = Math.min(300, 30 + Math.floor(gameTime / 3)); 
            if(!force && enemies.length >= maxEnemies) return;

            let angle = Math.random() * Math.PI * 2;
            let dist = Math.max(width, height) / ZOOM / 2 + 100; 
            let sx = player.x + Math.cos(angle) * dist;
            let sy = player.y + Math.sin(angle) * dist;
            
            sx = Math.max(0, Math.min(mapSize.width, sx)); sy = Math.max(0, Math.min(mapSize.height, sy));

            let type = 'basic'; let r = Math.random();
            if (gameTime > 30) { if (r < 0.2) type = 'swarm'; else if (r < 0.3) type = 'bat'; else if (r < 0.4) type = 'dasher';}
            if (gameTime > 60) { if (r < 0.15) type = 'shooter'; else if (r < 0.3) type = 'bomber'; else if (r < 0.4) type = 'teleporter'; }
            if (gameTime > 90) { if (r < 0.1) type = 'splitter'; else if (r < 0.2) type = 'tank'; else if (r < 0.3) type = 'ghost'; else if (r < 0.4) type = 'golem'; else if (r < 0.5) type = 'spawner'; }
            
            if (type === 'swarm' || type === 'bat') {
                for(let i=0; i<3; i++) enemies.push(new Enemy(type, sx + (Math.random()-0.5)*50, sy + (Math.random()-0.5)*50, difficulty));
            } else {
                enemies.push(new Enemy(type, sx, sy, difficulty));
            }
        }

        function killEnemy(e, p) {
            e.hp = 0; p.kills++; 
            if (e.isBoss) {
                bossActive = false; currentBoss = null;
                items.push(new Item(e.x - 20, e.y, 'health', 0));
                items.push(new Item(e.x + 20, e.y, 'magnet', 0));
                items.push(new Item(e.x, e.y - 30, 'diff_changer', 0));
                document.getElementById('uiTime').parentElement.classList.remove('boss-warning');
            } else {
                let dropLuck = 1 + (p.getStat('gold_digger') * 0.4);
                if (Math.random() < 0.005 * dropLuck) items.push(new Item(e.x, e.y, 'weapon', weaponsDb[Math.floor(Math.random() * weaponsDb.length)]));
                else {
                    let xpGain = e.xp * (1 + (p.getStat('xp_up') * 0.3)) * difficulty;
                    items.push(new Item(e.x, e.y, 'xp', xpGain));
                }
            }

            if (p.getStat('death_bloom') > 0 && Math.random() < (p.getStat('death_bloom') * 0.1)) {
                for(let i=0; i<8; i++) projectiles.push(new Projectile(e.x, e.y, (Math.PI/4)*i, 10, p.damage*0.5, 0, 0, 0, 1, 'single', '#ffffff', false, p, 'bloom', 0));
            }
            if (e.type === 'splitter') {
                for(let i=0; i<3; i++) enemies.push(new Enemy('splitter_mini', e.x+(Math.random()-0.5)*20, e.y+(Math.random()-0.5)*20, difficulty));
            }
            if (p.getStat('vampire') > 0 && Math.random() < (p.getStat('vampire') * 0.04)) p.heal(p.maxHp * 0.05); 
        }

        function gainXp(amount) {
            player.xp += amount;
            while (player.xp >= player.nextXp) {
                player.xp -= player.nextXp;
                player.nextXp = Math.floor(player.nextXp * 1.2 + 10); 
                levelUpQueue++;
            }
            if (levelUpQueue > 0 && gameState === 'playing') processLevelUp();
            updateStatsUI();
        }

        function processLevelUp() {
            if (levelUpQueue > 0) {
                gameState = 'levelup'; handleJoystickEnd(); levelUpQueue--; player.level++; 
                let healPct = 0.2 + (player.getStat('level_heal') * 0.1);
                player.heal(player.maxHp * healPct); 
                generateLevelUpOptions();
                document.getElementById('levelUpScreen').classList.remove('hidden'); document.getElementById('levelUpScreen').classList.add('flex');
                document.getElementById('rerollBtn').onclick = () => { generateLevelUpOptions(); };
                updateStatsUI();
            }
        }

        function generateLevelUpOptions() {
            let container = document.getElementById('skillsContainer'); container.innerHTML = '';
            let pool = availableSkills.filter(s => player.getStat(s.id) < s.maxLv);
            pool.sort(() => 0.5 - Math.random()); let choices = pool.slice(0, 3);
            if (choices.length === 0) choices = [{ id: 'heal_full', name: '全面恢復', desc: '恢復 100% 生命值', maxLv: 999 }];

            choices.forEach((skill, idx) => {
                let currentLv = player.getStat(skill.id) || 0;
                let btn = document.createElement('div');
                btn.className = 'skill-choice-btn bg-gray-800 hover:bg-gray-700 border-2 border-blue-500 rounded-xl p-6 cursor-pointer flex-1 text-center transition transform hover:-translate-y-2 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)] flex flex-col justify-between relative';
                let effText = skill.getEffect ? skill.getEffect(currentLv + 1) : '';
                btn.innerHTML = `
                    <div class="absolute top-2 left-2 bg-gray-900 text-gray-400 rounded px-2 py-1 text-xs font-bold">[${idx+1}]</div>
                    <div><h3 class="text-2xl font-bold text-blue-300 mb-2 mt-4">${skill.name}</h3><div class="text-sm text-gray-400 mb-2">Lv.${currentLv} &rarr; <span class="text-white font-bold">${currentLv+1}</span></div><p class="text-gray-300 mb-4">${skill.desc}</p></div>
                    ${effText ? `<div class="bg-gray-900 text-green-400 p-2 rounded text-sm font-bold border border-green-800">${effText}</div>` : ''}
                `;
                btn.onclick = () => selectSkill(skill.id);
                container.appendChild(btn);
            });
        }

        function selectSkill(skillId) {
            if (skillId === 'heal_full') player.heal(player.maxHp);
            else player.skills[skillId] = (player.skills[skillId] || 0) + 1;
            document.getElementById('levelUpScreen').classList.add('hidden'); document.getElementById('levelUpScreen').classList.remove('flex');
            player.invulnTimer = 120; gameState = 'playing';
            if (levelUpQueue > 0) setTimeout(() => { if (gameState === 'playing') processLevelUp(); }, 100);
            updatePauseUI();
        }

        function unlockOrUpgradeWeapon(weaponData) {
            let existing = player.weapons.find(w => w.id === weaponData.id);
            if (existing) {
                existing.level++;
            } else {
                player.weapons.push({ ...weaponData, level: 1 });
            }
            updateWeaponUI();
        }

        function switchWeaponByIndex(idx) {
            if (idx >= 0 && idx < weaponsDb.length && gameState === 'playing') {
                let targetWep = weaponsDb[idx];
                let owned = player.weapons.findIndex(w => w.id === targetWep.id);
                if (owned !== -1) { player.currentWeaponIdx = owned; updateWeaponUI(); }
            }
        }

        function updateWeaponUI() {
            let container = document.getElementById('weaponContainer'); container.innerHTML = '';
            weaponsDb.forEach((baseWep, idx) => {
                let ownedIdx = player.weapons.findIndex(w => w.id === baseWep.id);
                let isOwned = ownedIdx !== -1;
                let isActive = player.currentWeaponIdx === ownedIdx;
                let wepData = isOwned ? player.weapons[ownedIdx] : baseWep;

                let div = document.createElement('div');
                div.className = `weapon-slot w-14 h-14 rounded flex flex-col items-center justify-center font-bold cursor-pointer relative z-30 pointer-events-auto ${isActive ? 'active' : (isOwned ? 'bg-gray-800' : 'bg-gray-900 opacity-50')}`;
                div.style.color = isOwned ? wepData.color : '#4a5568';
                div.innerHTML = `<div class="absolute top-0 left-1 text-[10px] text-gray-400">${idx+1}</div><div class="text-sm">${wepData.name}</div>${isOwned ? `<div class="text-xs text-yellow-300">Lv.${wepData.level}</div>` : ''}`;
                div.title = wepData.desc;
                div.addEventListener('mousedown', (e) => { e.stopPropagation(); });
                div.addEventListener('touchstart', (e) => { e.stopPropagation(); }, {passive: false});
                div.onclick = (e) => { e.stopPropagation(); switchWeaponByIndex(idx); };
                container.appendChild(div);
            });
        }

        function updateStatsUI() {
            if (!player) return;
            document.getElementById('uiLevel').innerText = formatNum(player.level);
            document.getElementById('uiXp').innerText = formatNum(Math.floor(player.xp));
            document.getElementById('uiNextXp').innerText = formatNum(player.nextXp);
            document.getElementById('xpBar').style.width = `${(player.xp / player.nextXp) * 100}%`;
            document.getElementById('uiHp').innerText = formatNum(Math.floor(player.hp));
            document.getElementById('uiMaxHp').innerText = formatNum(Math.floor(player.maxHp));
            document.getElementById('uiKills').innerText = formatNum(player.kills);
            document.getElementById('uiDamage').innerText = formatNum(player.damage);
            let m = Math.floor(gameTime / 60).toString().padStart(2, '0'); let s = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById('uiTime').innerText = bossActive ? "BOSS 戰" : `${m}:${s}`;
        }

        function updatePauseUI() {
            let wCont = document.getElementById('pauseWeaponsList'); wCont.innerHTML = '';
            player.weapons.forEach(w => {
                let div = document.createElement('div'); div.className = "bg-gray-700 p-3 rounded";
                div.innerHTML = `<div class="font-bold text-lg" style="color:${w.color}">${w.name} <span class="text-white text-sm">Lv.${w.level}</span></div><div class="text-sm text-gray-300">${w.desc}</div><div class="text-xs text-yellow-400 mt-1 leading-tight">${getWeaponEffectsDesc(w.id, w.level)}</div>`;
                wCont.appendChild(div);
            });
            let sCont = document.getElementById('acquiredSkillsList'); sCont.innerHTML = '';
            for (let skillId in player.skills) {
                let lv = player.skills[skillId]; let ref = availableSkills.find(s => s.id === skillId);
                if (ref) {
                    let eff = ref.getEffect ? ref.getEffect(lv) : ''; let el = document.createElement('div'); el.className = 'bg-gray-700 p-2 rounded flex justify-between items-center';
                    el.innerHTML = `<div><span class="text-blue-300 font-bold">${ref.name}</span> <span class="text-xs text-gray-400">Lv.${lv}</span></div> <div class="text-xs text-green-400">${eff}</div>`;
                    sCont.appendChild(el);
                }
            }
        }

        function openPauseMenu() {
            gameState = 'paused'; handleJoystickEnd(); updatePauseUI();
            document.getElementById('pauseScreen').classList.remove('hidden'); document.getElementById('pauseScreen').classList.add('flex');
        }

        function openDiffModal() {
            gameState = 'diff_select'; handleJoystickEnd();
            document.getElementById('diffScreen').classList.remove('hidden'); document.getElementById('diffScreen').classList.add('flex');
            document.getElementById('itemCustomDiff').value = difficulty;
            document.querySelectorAll('.i-diff-btn').forEach(btn => {
                if(parseInt(btn.getAttribute('data-val')) === difficulty) btn.classList.add('border-2', 'border-white');
                else btn.classList.remove('border-2', 'border-white');
            });
        }

        function resumeGame() {
            document.getElementById('pauseScreen').classList.add('hidden'); document.getElementById('pauseScreen').classList.remove('flex');
            gameState = 'playing'; if(levelUpQueue > 0) processLevelUp();
        }

        function triggerGameOver() {
            gameState = 'gameover'; handleJoystickEnd();
            document.getElementById('goLevel').innerText = formatNum(player.level); document.getElementById('goKills').innerText = formatNum(player.kills);
            document.getElementById('gameOverScreen').classList.remove('hidden'); document.getElementById('gameOverScreen').classList.add('flex');
        }

        function drawBackground() {
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
            let gridSize = 100 * ZOOM;
            let startX = -((camera.x * ZOOM) % gridSize); 
            let startY = -((camera.y * ZOOM) % gridSize);
            
            ctx.beginPath();
            for (let x = startX; x < width; x += gridSize) { ctx.moveTo(Math.round(x), 0); ctx.lineTo(Math.round(x), height); }
            for (let y = startY; y < height; y += gridSize) { ctx.moveTo(0, Math.round(y)); ctx.lineTo(width, Math.round(y)); }
            ctx.stroke();
            
            ctx.strokeStyle = 'red'; ctx.lineWidth = 5 * ZOOM;
            let bx = Math.round(-camera.x * ZOOM); let by = Math.round(-camera.y * ZOOM);
            ctx.strokeRect(bx, by, mapSize.width * ZOOM, mapSize.height * ZOOM);
        }

        function drawVisualEffects() {
            for (let i = visualEffects.length - 1; i >= 0; i--) {
                let v = visualEffects[i];
                if(v.type === 'text') {
                    let el = document.createElement('div'); el.className = v.css; el.innerText = v.text;
                    let screenX = (v.x - camera.x) * ZOOM; let screenY = (v.y - camera.y) * ZOOM;
                    el.style.left = screenX + 'px'; el.style.top = screenY + 'px';
                    uiContainer.appendChild(el);
                    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
                    visualEffects.splice(i, 1); continue;
                }
                if (!inView(v.x || v.x1 || 0, v.y || v.y1 || 0, 500)) { visualEffects.splice(i,1); continue; }

                if (v.type === 'lightning' || v.type === 'lightning_strike') {
                    if (v.type === 'lightning') {
                        ctx.beginPath(); ctx.moveTo(v.x1, v.y1); ctx.lineTo(v.x2, v.y2);
                        ctx.strokeStyle = '#ecc94b'; ctx.lineWidth = 2 + Math.random()*2; ctx.stroke();
                    } else {
                        ctx.beginPath(); ctx.moveTo(v.x, v.y - 1000); ctx.lineTo(v.x, v.y);
                        ctx.strokeStyle = '#ecc94b'; ctx.lineWidth = 15; ctx.stroke();
                    }
                    v.timer--; if(v.timer <= 0) visualEffects.splice(i, 1);
                } 
                else if (v.type === 'meteor') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    let mRad = Math.max(0, v.radius || 120); let yOff = (v.timer / 30) * 800; 
                    if (v.timer > 15) {
                        ctx.beginPath(); ctx.arc(0, Math.round(-yOff), Math.round(Math.max(0, mRad * 0.3)), 0, Math.PI * 2); ctx.fillStyle = '#f56565'; ctx.fill();
                    } else {
                        if (v.timer === 15) { for (let e of enemies) if (inView(e.x,e.y,mRad) && Math.hypot(e.x - v.x, e.y - v.y) < mRad) e.takeDamage(v.dmg, v.player, true); }
                        ctx.beginPath(); ctx.arc(0, 0, Math.round(Math.max(0, (15 - v.timer) * (mRad/15))), 0, Math.PI * 2); 
                        ctx.fillStyle = `rgba(245, 101, 101, ${v.timer / 15})`; ctx.fill();
                    }
                    ctx.restore(); v.timer--; if(v.timer <= 0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'explosion' || v.type === 'blood_nova') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    let maxT = v.type === 'blood_nova' ? 20 : 15;
                    let currentRadius = Math.max(0, v.radius * (1 - v.timer/maxT));
                    ctx.beginPath(); ctx.arc(0,0, Math.round(currentRadius), 0, Math.PI*2);
                    ctx.fillStyle = v.type === 'explosion' ? `rgba(237, 137, 54, ${v.timer/15})` : `rgba(229, 62, 62, ${v.timer/20})`; 
                    ctx.fill(); ctx.restore();
                    v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'laser') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y)); ctx.rotate(v.angle);
                    let lWidth = Math.max(0, v.width || 60); ctx.fillStyle = `rgba(159, 122, 234, ${v.timer/20})`; 
                    ctx.fillRect(0, Math.round(-lWidth/2), Math.round(width/ZOOM * 2), Math.round(lWidth)); 
                    if (v.timer === 20) { 
                        for (let e of enemies) {
                            if(!inView(e.x, e.y, 500)) continue;
                            let ex = e.x - v.x; let ey = e.y - v.y;
                            let distToLine = Math.abs(Math.sin(v.angle)*ex - Math.cos(v.angle)*ey);
                            let forward = (ex * Math.cos(v.angle) + ey * Math.sin(v.angle)) > 0;
                            if (forward && distToLine < (lWidth/2) + e.radius) e.takeDamage(v.dmg, v.player, true);
                        }
                    }
                    ctx.restore(); v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'nova' || v.type === 'frost_armor_nova') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    let maxT = v.type === 'nova' ? 30 : 15;
                    let curR = Math.max(0, v.radius * (1 - v.timer/maxT));
                    ctx.beginPath(); ctx.arc(0, 0, Math.round(curR), 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(99, 179, 237, ${v.timer/maxT})`; ctx.lineWidth = 10; ctx.stroke();
                    if (v.timer === 30 && v.type === 'nova') {
                        for (let e of enemies) if (inView(e.x,e.y,v.radius) && Math.hypot(e.x - v.x, e.y - v.y) < v.radius) { e.frozenTimer = 180; e.takeDamage(v.player.damage, v.player, false); }
                    }
                    ctx.restore(); v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'holy_nova') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    let curR = Math.max(0, v.radius * (1 - v.timer/15));
                    ctx.beginPath(); ctx.arc(0, 0, Math.round(curR), 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(255, 235, 133, ${v.timer/15})`; ctx.lineWidth = 8; ctx.stroke();
                    ctx.restore(); v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'blackhole') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    let coreSize = v.drawSize || 30;
                    ctx.beginPath(); ctx.arc(0, 0, Math.round(Math.max(0, coreSize + Math.sin(v.timer*0.5)*5)), 0, Math.PI*2);
                    ctx.fillStyle = '#1a202c'; ctx.fill(); ctx.strokeStyle = '#805ad5'; ctx.lineWidth = 3; ctx.stroke();
                    if(v.timer % 10 === 0) {
                        for(let e of enemies) {
                            if(!inView(e.x, e.y, v.radius)) continue;
                            let d = Math.hypot(e.x - v.x, e.y - v.y);
                            if (d < Math.max(0, v.radius)) {
                                let a = Math.atan2(v.y - e.y, v.x - e.x);
                                e.x += Math.cos(a) * v.pullForce; e.y += Math.sin(a) * v.pullForce; e.takeDamage(v.dmg, v.player, false);
                            }
                        }
                    }
                    ctx.restore(); v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'poison_cloud') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    ctx.beginPath(); ctx.arc(0, 0, Math.round(Math.max(0, v.radius)), 0, Math.PI*2);
                    ctx.fillStyle = `rgba(72, 187, 120, ${Math.min(0.5, v.timer/30)})`; ctx.fill();
                    if(v.timer % 30 === 0) {
                        for(let e of enemies) if(inView(e.x, e.y, v.radius) && Math.hypot(e.x - v.x, e.y - v.y) < v.radius) e.takeDamage(v.dmg, v.player, false);
                    }
                    ctx.restore(); v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'arrow_rain') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    ctx.beginPath(); ctx.moveTo(Math.round((Math.random()-0.5)*v.radius), -100); ctx.lineTo(Math.round((Math.random()-0.5)*v.radius), 0);
                    ctx.strokeStyle = '#d69e2e'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.restore(); v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
                else if (v.type === 'mirage') {
                    ctx.save(); ctx.translate(Math.round(v.x), Math.round(v.y));
                    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(66, 153, 225, ${v.timer/60})`; ctx.fill();
                    ctx.restore(); v.timer--; if(v.timer<=0) visualEffects.splice(i, 1);
                }
            }
        }

        function gameLoop(time) {
            let dt = (time - lastTime) / 1000;
            lastTime = time;

            if (gameState === 'playing') {
                if (!bossActive) gameTime += dt; 
                player.update();
                
                if (!bossActive && gameTime >= nextBossTime) { spawnBoss(); nextBossTime += 300; }
                
                if (bossActive && currentBoss && !bossPhase2Triggered && (currentBoss.hp / currentBoss.maxHp) < 0.5) {
                    bossPhase2Triggered = true;
                    for(let i=0; i<100; i++) spawnEnemy(true);
                }

                if (!bossActive) {
                    let spawnChance = 0.01 + (gameTime / 4000); 
                    if (Math.random() < Math.min(0.1, spawnChance)) spawnEnemy();
                }

                enemies = enemies.filter(e => e.hp > 0); enemies.forEach(e => e.update(player, difficulty));
                projectiles = projectiles.filter(p => p.active); projectiles.forEach(p => p.update());
                enemyProjectiles = enemyProjectiles.filter(p => p.active); enemyProjectiles.forEach(p => p.update(player));
                items = items.filter(i => i.active); items.forEach(i => i.update(player));
                
                if(levelUpQueue > 0) processLevelUp();
                if (Math.random() < 0.1) updateStatsUI();
            }

            if (gameState !== 'start') {
                ctx.fillStyle = '#1a202c'; ctx.fillRect(0, 0, width, height);
                ctx.save(); ctx.scale(ZOOM, ZOOM); ctx.translate(Math.round(-camera.x), Math.round(-camera.y));
                drawBackground();
                items.forEach(i => i.draw(ctx));
                enemies.forEach(e => e.draw(ctx));
                projectiles.forEach(p => p.draw(ctx));
                enemyProjectiles.forEach(p => p.draw(ctx));
                if(player) player.draw(ctx);
                drawVisualEffects();
                ctx.restore();
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        document.querySelectorAll('.i-diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.i-diff-btn').forEach(b => b.classList.remove('border-2', 'border-white'));
                e.target.classList.add('border-2', 'border-white');
                difficulty = parseInt(e.target.getAttribute('data-val'));
                document.getElementById('itemCustomDiff').value = difficulty;
            });
        });

        document.getElementById('itemCustomDiff').addEventListener('input', (e) => {
            document.querySelectorAll('.i-diff-btn').forEach(b => b.classList.remove('border-2', 'border-white'));
            let val = parseInt(e.target.value);
            if(val > 0) difficulty = val;
        });

        document.getElementById('applyDiffBtn').addEventListener('click', () => {
            document.getElementById('diffScreen').classList.add('hidden'); document.getElementById('diffScreen').classList.remove('flex');
            
            document.getElementById('uiDiffText').innerText = `自訂 (x${difficulty})`;
            if(difficulty===1) document.getElementById('uiDiffText').innerText = "簡單 (x1)";
            if(difficulty===5) document.getElementById('uiDiffText').innerText = "普通 (x5)";
            if(difficulty===25) document.getElementById('uiDiffText').innerText = "困難 (x25)";
            if(difficulty===100) document.getElementById('uiDiffText').innerText = "地獄 (x100)";
            
            gameState = 'playing'; if(levelUpQueue > 0) processLevelUp();
        });

        document.getElementById('startBtn').addEventListener('click', () => { initGame(5); }); 
        document.getElementById('restartBtn').addEventListener('click', () => { initGame(5); });
        document.getElementById('pauseBtn').addEventListener('mousedown', (e) => e.stopPropagation());
        document.getElementById('pauseBtn').addEventListener('touchstart', (e) => e.stopPropagation(), {passive:false});
        document.getElementById('pauseBtn').addEventListener('click', () => { if (gameState === 'playing') openPauseMenu(); });
        document.getElementById('resumeBtn').addEventListener('click', resumeGame);
    </script>
</body>
</html>
